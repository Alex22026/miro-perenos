name: cleanup
on:
  push:
    paths: ["jobs/cleanup.json"]
permissions:
  contents: write
concurrency: cleanup
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/cleanup.py
        env:
          MIRO_TOKEN: ${{ secrets.MIRO_TOKEN }}
      - run: |
          git config user.name "cleanup-bot"; git config user.email "cleanup-bot@users.noreply.github.com"
          git add results; git commit -m "Список/удаление досок Miro" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
