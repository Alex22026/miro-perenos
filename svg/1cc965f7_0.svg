<svg xmlns="http://www.w3.org/2000/svg">
<textArea id="o1" x="-22867.0" y="-11693.4" width="12986.7" font-size="99.9" font-family="open_sans" fill="#212529" text-align="left"><i><b>Окружность</b></i><i> — это замкнутая линия, состоящая из множества точек, которые равноудалены от центра окружности</i>. Основной элемент окружности — это радиус, он соединяет центр с любой точкой на окружности.</textArea>
<image id="o2" data-type="image" href="https://storage.yandexcloud.net/sboard-whiteboard-prod/images/49ef57e7-a92e-4f08-81be-291d6f18bc6d4d951d7f-6f7c-4f6d-af23-5d3e0076a0174371db51-8dc0-48e4-82e7-4471e9a31ff780a7ebd9-c18e-49db-a0d3-a6a7d88f302e/Screenshot 2024-11-09 at 23.11.45.png" x="-23956.3" y="-10684.8" width="2053.6" height="1205.8" />
<image id="o3" data-type="image" href="https://storage.yandexcloud.net/sboard-whiteboard-prod/images/245ea809-4a40-4a8e-9e33-72f7d61c930c89ef136e-f7dd-475c-9ad7-c247c9b6d21c0c769c32-f244-4f32-a377-a5b784da9bc6d668b080-d5d7-43e9-9b6e-6f24dcc42c5d/Screenshot 2024-11-09 at 23.12.16.png" x="-21246.8" y="-10914.8" width="2968.2" height="588.7" />
<textArea id="o4" x="-22732.3" y="-9576.3" width="16528.3" font-size="111.8" font-family="open_sans" fill="#212529" text-align="left"><b>хорда</b> — это отрезок, который соединяет 2 любые точки на окружности. Если хорда пройдёт через центр окружности, то она превратится в <b>диаметр</b>. Кстати, если внимательно посмотреть, то можно увидеть, что диаметр — это 2 радиуса!</textArea>
<image id="o5" data-type="image" href="https://storage.yandexcloud.net/sboard-whiteboard-prod/images/f8e1858a-a6f3-4057-8e88-bd9461e89e7f6ebfb5f6-42af-496d-a993-034ac009874c18a7a4ba-1b3b-4b93-a0c3-c9952daa4e3b6af93ffa-2fc5-4a2c-a41e-da294d9f911a/Screenshot 2024-11-09 at 23.35.31.png" x="-23641.4" y="2687.8" width="2620.5" height="2310.7" />
