<rect id="o8" data-shape="round_rectangle" x="-8423.2" y="-7555.8" width="2016.5" height="419.7" fill="#ea728a" stroke="none" data-content="&lt;br/&gt;Чисто технически диаметр окружности является её хордой, так как по определению это отрезок, соединяющий две точки окружности. Но запомните: любой диаметр является хордой, но не любая хорда — это диаметр. " data-text-color="#ffffff" data-font-size="47.8" data-font-family="open_sans" data-text-align="center" data-text-align-vertical="middle" />
