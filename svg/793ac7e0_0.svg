<rect id="o46" data-shape="round_rectangle" x="-7942.8" y="8172.0" width="2950.6" height="3443.9" fill="#e34363" stroke="none" data-content="&lt;b&gt;1. Радиус окружности равен 5 см. Чему равен её диаметр?&lt;/b&gt;&lt;br/&gt;А) 2,5 см&lt;br/&gt;Б) 5 см&lt;br/&gt;В) 10 см&lt;br/&gt;Г) 15 см&lt;br/&gt;&lt;br/&gt;&lt;b&gt;2. Отрезок, соединяющий две точки окружности, называется…&lt;/b&gt;&lt;br/&gt;А) радиус&lt;br/&gt;Б) диаметр&lt;br/&gt;В) хорда&lt;br/&gt;Г) дуга&lt;br/&gt;&lt;br/&gt;&lt;b&gt;3. Хорда, проходящая через центр окружности, называется…&lt;/b&gt;&lt;br/&gt;А) радиус&lt;br/&gt;Б) диаметр&lt;br/&gt;В) касательная&lt;br/&gt;Г) секущая&lt;br/&gt;&lt;br/&gt;&lt;b&gt;4. Угол с вершиной в центре окружности называется…&lt;/b&gt;&lt;br/&gt;А) вписанный&lt;br/&gt;Б) центральный&lt;br/&gt;В) прямой&lt;br/&gt;Г) развёрнутый&lt;br/&gt;&lt;br/&gt;&lt;b&gt;5. Часть окружности, заключённая между двумя точками, называется…&lt;/b&gt;&lt;br/&gt;А) хорда&lt;br/&gt;Б) диаметр&lt;br/&gt;В) дуга&lt;br/&gt;Г) сектор&lt;br/&gt;&lt;br/&gt;&lt;b&gt;6. Диаметр делит окружность на две равные части. Сколько градусов в каждой половине?&lt;/b&gt;&lt;br/&gt;А) 90°&lt;br/&gt;Б) 120°&lt;br/&gt;В) 180°&lt;br/&gt;Г) 360°" data-text-color="#ffffff" data-font-size="47.8" data-font-family="open_sans" data-text-align="center" data-text-align-vertical="middle" />
<rect id="o47" data-shape="round_rectangle" x="-3223.6" y="8172.0" width="2996.2" height="3443.9" fill="#e02b50" stroke="none" data-content="&lt;b&gt;7. Чему равна градусная мера всей окружности?&lt;/b&gt;&lt;br/&gt;А) 90°&lt;br/&gt;Б) 180°&lt;br/&gt;В) 270°&lt;br/&gt;Г) 360°&lt;br/&gt;&lt;br/&gt;&lt;b&gt;8. Может ли хорда быть равна диаметру?&lt;/b&gt;&lt;br/&gt;А) Нет, никогда&lt;br/&gt;Б) Да, всегда&lt;br/&gt;В) Да, если это и есть диаметр&lt;br/&gt;Г) Только в прямоугольном треугольнике&lt;br/&gt;&lt;br/&gt;&lt;b&gt;9. Прямая, имеющая с окружностью только одну общую точку, называется…&lt;/b&gt;&lt;br/&gt;А) секущая&lt;br/&gt;Б) хорда&lt;br/&gt;В) касательная&lt;br/&gt;Г) радиус&lt;br/&gt;&lt;br/&gt;&lt;b&gt;10. Касательная к окружности перпендикулярна радиусу, проведённому в точку касания. Если радиус равен 6 см, то чему равно расстояние от центра до касательной?&lt;/b&gt;&lt;br/&gt;А) 3 см&lt;br/&gt;Б) 6 см&lt;br/&gt;В) 12 см&lt;br/&gt;Г) 18 см&lt;br/&gt;&lt;br/&gt;&lt;b&gt;11. В окружности проведены две равные хорды. Что можно сказать о дугах, которые они стягивают?&lt;/b&gt;&lt;br/&gt;А) Дуги равны&lt;br/&gt;Б) Дуги различны&lt;br/&gt;В) Сумма дуг равна 180°&lt;br/&gt;Г) Дуги являются диаметрами" data-text-color="#ffffff" data-font-size="47.8" data-font-family="open_sans" data-text-align="center" data-text-align-vertical="middle" />
<rect id="o48" data-shape="round_rectangle" x="1286.9" y="8172.0" width="2912.7" height="3443.9" fill="#e34363" stroke="none" data-content="&lt;b&gt;12. В окружности центральный угол равен 90°. Какую дугу он опирает?&lt;/b&gt;&lt;br/&gt;А) 45°&lt;br/&gt;Б) 90°&lt;br/&gt;В) 180°&lt;br/&gt;Г) 360°&lt;br/&gt;&lt;br/&gt;&lt;b&gt;13. Хорда находится на расстоянии 8 см от центра окружности. Радиус окружности равен 10 см. Найдите длину хорды.&lt;/b&gt;&lt;br/&gt;А) 6 см&lt;br/&gt;Б) 12 см&lt;br/&gt;В) 16 см&lt;br/&gt;Г) 20 см&lt;br/&gt;&lt;br/&gt;&lt;b&gt;14. Диаметр окружности равен 26 см. Найдите расстояние от центра до хорды, длина которой 10 см.&lt;/b&gt;&lt;br/&gt;А) 5 см&lt;br/&gt;Б) 12 см&lt;br/&gt;В) 13 см&lt;br/&gt;Г) 24 см&lt;br/&gt;&lt;br/&gt;&lt;b&gt;15. Из одной точки к окружности проведены касательная и хорда. Хорда видна из центра под углом 100°. Чему равен угол между касательной и хордой?&lt;/b&gt;&lt;br/&gt;А) 50°&lt;br/&gt;Б) 100°&lt;br/&gt;В) 200°&lt;br/&gt;Г) 40°" data-text-color="#ffffff" data-font-size="47.8" data-font-family="open_sans" data-text-align="center" data-text-align-vertical="middle" />
</svg>
