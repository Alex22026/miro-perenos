<textArea id="o18" x="-28205.9" y="-6179.5" width="813.6" font-size="102.7" font-family="open_sans" fill="#1a1a1a" text-align="left">Треугольники</textArea>
<textArea id="o19" x="-27785.9" y="-3433.9" width="1084.8" font-size="102.7" font-family="open_sans" fill="#1a1a1a" text-align="left">Четырёхугольники</textArea>
<textArea id="o20" x="-27737.2" y="56.9" width="4348.2" font-size="33.4" font-family="open_sans" fill="#212529" text-align="left"><i><b>Окружность</b></i><i> — это замкнутая линия, состоящая из множества точек, которые равноудалены от центра окружности</i>. Основной элемент окружности — это радиус, он соединяет центр с любой точкой на окружности.</textArea>
<textArea id="o21" x="-27692.2" y="765.7" width="5534.0" font-size="37.4" font-family="open_sans" fill="#212529" text-align="left"><b>хорда</b> — это отрезок, который соединяет 2 любые точки на окружности. Если хорда пройдёт через центр окружности, то она превратится в <b>диаметр</b>. Кстати, если внимательно посмотреть, то можно увидеть, что диаметр — это 2 радиуса!</textArea>
<textArea id="o22" x="-13953.0" y="682.5" width="3543.1" font-size="57.4" font-family="open_sans" fill="#1a1a1a" text-align="left"><b>Окружность вписана в прямоугольный треугольник</b></textArea>
