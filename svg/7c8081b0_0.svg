<textArea id="o43" x="8739.4" y="-6629.7" width="6749.1" font-size="322.0" font-family="open_sans" fill="#1a1a1a" text-align="left"><b>Треугольники и четырёхугольники</b></textArea>
<textArea id="o44" x="11485.6" y="1834.2" width="12681.0" font-size="322.0" font-family="open_sans" fill="#1a1a1a" text-align="left"><b>Окружности и многоугольники</b></textArea>
<ellipse id="o45" cx="17209.1" cy="5154.1" rx="271.4" ry="254.0" fill="none" stroke="#000000" stroke-width="3" />
<ellipse id="o46" cx="25652.6" cy="6118.4" rx="234.5" ry="226.2" fill="none" stroke="#000000" stroke-width="3" />
<textArea id="o47" x="26675.8" y="5510.4" width="1885.3" font-size="34.8" font-family="open_sans" fill="#000000" text-align="left">Теорема о касательной и секущей: квадрат качательной=произведению отрезков секущей</textArea>
<textArea id="o48" x="26726.8" y="5859.1" width="1597.3" font-size="31.7" font-family="open_sans" fill="#000000" text-align="left">Проведем радиус ОК.<br/>Так как нам известен косинус ВАС, то надо этим пользоваться, а для этого нужно сделать треугольник, продлим ОК до диаметра. Пусть диаметр пересекает сторону АС в точке L, а другая точка диаметра F.<br/>Используя косинус мы сможем найти гипотенузу прямоугольного треугольника AKL</textArea>
<textArea id="o49" x="26698.1" y="6217.4" width="5058.2" font-size="33.3" font-family="open_sans" fill="#000000" text-align="left">Зная отрезок AL, мы можем найти отрезок ML, а зная весь отрезок мы можем найти LN, в результате у нас получится пересечение хорды MN и KN. В результате получится некое уравнение, в котором участвует радиус. Найдем сначала ML и NL </textArea>
<textArea id="o50" x="26707.2" y="6541.2" width="2904.4" font-size="31.0" font-family="open_sans" fill="#000000" text-align="left">Вспомним, что если в окружности пересекаются две хорды, то произведение отрезков одной хорды на произведение отрезков другой хорды будет равно</textArea>
