<svg xmlns="http://www.w3.org/2000/svg">
<textArea id="o1" x="-2348.2" y="-1674.6" width="249.4" font-size="33.8" font-family="open_sans" fill="#66cdaa" text-align="left"><b>ОДНОЧЛЕНЫ</b></textArea>
<rect id="o2" data-shape="rectangle" x="-2338.7" y="-793.6" width="1038.1" height="1692.0" fill="#ffffff" stroke="none" />
<image id="o3" data-type="image" href="https://storage.yandexcloud.net/sboard-whiteboard-prod/images/5806365b-433a-4be6-a735-18878346f739e9b6f482-8c92-45b2-9ce7-347372ac42b321304246-701a-47bf-b342-18329c3d0605ec23b24e-fd58-494f-baa9-c118fd1b5a6d/clipboard-file.png" x="-2338.7" y="-1491.4" width="1022.1" height="179.8" />
<textArea id="o7" x="-2341.1" y="-1228.3" width="1077.0" font-size="33.2" font-family="open_sans" fill="#000000" text-align="center">Степенью одночлена называют сумму показателей степеней<br/>всех входящих в него переменных. Если одночлен не содер-<br/>жит переменных и является числом, отличным от нуля, то<br/>степень этого одночлена считают равной нулю.</textArea>
<textArea id="o31" x="-2338.7" y="-823.9" width="1090.3" font-size="28.0" font-family="open_sans" fill="#000000" text-align="center">Число 0 является одночленом, степень которого не определена</textArea>
<textArea id="o32" x="-2338.7" y="-928.9" width="1112.5" font-size="28.0" font-family="open_sans" fill="#000000" text-align="center">Числовой множитель одночлена, записанного в стандартном виде, называют<br/>коэффициентом одночлена</textArea>
<image id="o50" data-type="image" href="https://storage.yandexcloud.net/sboard-whiteboard-prod/images/f2dbb9c7-fb05-4644-841a-64ea900d038a3367de36-f91d-4468-b52b-06561b0228e9b5feaba4-766e-4e9c-8fa4-f5274130270f60db31a0-b28e-43d9-a22d-f0b28d359053/clipboard-file.png" x="-2348.0" y="-670.2" width="1011.6" height="121.3" />
<image id="o51" data-type="image" href="https://storage.yandexcloud.net/sboard-whiteboard-prod/images/856c16bb-8f76-488c-93ae-832a98b68b6d7c0be95d-6207-46b9-a7e4-c86424ad6a752255247d-da9c-4194-ba7d-2596595b40014a65408d-4de2-4904-8ed6-620c20fb3675/clipboard-file.png" x="-2338.7" y="-495.4" width="1020.1" height="177.0" />
<textArea id="o59" x="-2338.7" y="-275.2" width="2993.8" font-size="28.0" font-family="open_sans" fill="#000000" text-align="center">При умножении одночленов и возведении одночлена в степень используются правило умножения степеней с одинаковыми основаниями и правило возведения степени в степень</textArea>
<image id="o60" data-type="image" href="https://storage.yandexcloud.net/sboard-whiteboard-prod/images/22ccd4e1-11c7-4c13-ba99-62731b9e82d8e6c1f7f7-4579-4c49-90a3-27b97f8a357f52b39bc7-4c09-4363-a096-903a0fec1c2e39eab8d6-b182-41af-9d84-6a5db9e2c5d6/clipboard-file.png" x="-2348.0" y="-204.3" width="533.5" height="40.9" />
<image id="o61" data-type="image" href="https://storage.yandexcloud.net/sboard-whiteboard-prod/images/ff1bb6b8-d931-4bb5-9f86-b48451a4f2c293f159a9-bec3-453d-b34d-5203977dc6fe9c01706c-e902-4e3a-9c00-b7e213599a60a67251dd-b7be-42c0-8257-9cd4a4671ff5/clipboard-file.png" x="-2382.8" y="-131.4" width="730.8" height="60.7" />
