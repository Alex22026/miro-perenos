<textArea id="o69" x="367.3" y="1387.4" width="1695.0" font-size="26.5" font-family="open_sans" fill="#ff8934" text-align="left">Измеряя через каждую минуту температуру воды в бассейне в процессе нагревания, составили таблицу:</textArea>
<textArea id="o71" x="312.5" y="1725.2" width="1069.0" font-size="26.5" font-family="open_sans" fill="#ff8934" text-align="left">Постройте график зависимости y(x). По оY берем одну клеточку = 2°C . Используя график, ответьте на вопросы:<br/><b>1)</b> <b>На сколько градусов нагрелась вода в бассейне за первые 3 минуты?</b><br/><b>2) В какие промежутки времени температура повышалась одинаково?</b></textArea>
<image id="o72" data-type="image" href="https://raw.githubusercontent.com/Alex22026/miro-perenos/main/img/348fd53c080247e2cd6b.jpg" x="88.3" y="2279.6" width="800.0" height="534.6" />
