<svg xmlns="http://www.w3.org/2000/svg">
<textArea id="o1" x="-2478.2" y="-2946.9" width="180.7" font-size="32.0" font-family="open_sans" fill="#ff8934" text-align="left"><b>ФУНКЦИЯ</b></textArea>
<rect id="o2" data-shape="rectangle" x="-2478.2" y="-1612.0" width="1060.9" height="2603.0" fill="#ffffff" stroke="none" />
<textArea id="o3" x="-2467.1" y="-2734.9" width="1121.7" font-size="26.5" font-family="open_sans" fill="#e1ac18" text-align="center">Мы часто сталкиваемся с ситуациями, когда значение одной переменной зависит от значения другой. Например: <br/>При пешей прогулке пройденное расстояние зависит от времени прогулки.<br/>Площадь квадрата зависит от длины его стороны.<br/><br/>В каждом из этих примеров есть <i>независимая переменная (аргумент)</i><i>,</i> которая может менять своё значение (время прогулки, длина стороны), и <i>зависимая от неё переменная</i> - функция (пройденное расстояние, площадь, урожайность). <br/>Некоторые зависимости одной переменной от другой называют функциями.<b> </b></textArea>
<textArea id="o4" x="-2479.7" y="-2324.6" width="1148.9" font-size="26.5" font-family="open_sans" fill="#e1ac18" text-align="center">Способы задания функции: <br/>1) <b>Аналитический способ задания функции</b> — задание функции с помощью формулы.<br/>Например, функциями являются зависимости, заданные формулами</textArea>
<image id="o5" data-type="image" href="https://storage.yandexcloud.net/sboard-whiteboard-prod/images/79164414-80bd-43b8-afd5-81379c9a60b1b87df0a7-7faa-4381-881c-fcb6cabe5940f054467c-02a3-48b3-9650-c06f9d6d75a540ef59a3-d329-4276-b0e9-0175761f9da5/image.png" x="-2467.1" y="-2230.4" width="306.4" height="78.1" />
<textArea id="o6" x="-2258.5" y="-2230.4" width="183.5" font-size="19.9" font-family="open_sans" fill="#e1ac18" text-align="center">y зависит от x</textArea>
<textArea id="o7" x="-2479.9" y="-2115.7" width="1149.3" font-size="26.5" font-family="open_sans" fill="#e1ac18" text-align="center">Правило: <br/>Чтобы найти значение функции при данном значении аргумента и заданной формуле функции, надо подставить значение аргумента в формулу функции и вычислить значение выражения. </textArea>
<textArea id="o8" x="-2481.2" y="-1870.3" width="1152.1" font-size="26.5" font-family="open_sans" fill="#e1ac18" text-align="center">2) <b>Табличный способ задания функции.</b><br/>При табличном способе задания функции в одной строке таблицы записывают значения аргумента, а в другой — соответствующее каждому аргументу значение функции.</textArea>
<image id="o9" data-type="image" href="https://storage.yandexcloud.net/sboard-whiteboard-prod/images/82553df7-e5aa-44aa-bcdf-a3fce9addd1bc5584595-0834-4f5a-93d8-608bf5b110eb4ae678e7-383a-4d3e-89a2-c4ee431ac077eb1c1b37-4bd1-4b22-97e1-0238c723fb8f/clipboard-file.png" x="-2478.2" y="-1716.4" width="406.7" height="174.0" />
<textArea id="o10" x="-2231.2" y="-1734.4" width="131.1" font-size="19.9" font-family="open_sans" fill="#e1ac18" text-align="left">y(-1) = -2</textArea>
<textArea id="o11" x="-2478.2" y="-1462.2" width="1146.0" font-size="26.5" font-family="open_sans" fill="#e1ac18" text-align="center">3) <b>Графический способ</b> наглядно представляет функциональную зависимость. Чтобы графически задать функцию , надо на координатной плоскости отметить все точки          такие, что                 . Полученная линия называется графиком функции<b>. </b><br/>Заметим, что координатные оси тоже принято обозначать <i>x</i> и <i>y</i>. Это не случайное совпадение, по оси  Ox откладывается значение аргумента, а по оси Oy  значение функции. </textArea>
<image id="o12" data-type="image" href="https://storage.yandexcloud.net/sboard-whiteboard-prod/images/8940c155-7232-4294-88eb-ef829a037273619fd8dd-37e5-4644-be75-ed94f1d1ed3c771bd80d-736d-4cb5-bd17-0edc6b03279285c9ad1a-d775-4cbf-aaba-ae1d5378adac/image.png" x="-2814.6" y="-1492.8" width="53.5" height="32.1" />
<image id="o13" data-type="image" href="https://storage.yandexcloud.net/sboard-whiteboard-prod/images/d1f77de8-9787-4ecd-b778-ca47b42435269f732546-a879-4efe-b32f-dc51d359b48efc70b59a-a762-4b1a-93c6-f186f83a4914f385b775-c669-4874-bd4d-ef24a0d3dcab/image.png" x="-2589.8" y="-1488.1" width="82.2" height="37.3" />
<textArea id="o14" x="-2478.4" y="-624.0" width="1607.7" font-size="26.5" font-family="open_sans" fill="#e1ac18" text-align="center">Все значения, которые принимает независимая переменная, образуют область определения функции</textArea>
<rect id="o15" data-shape="rectangle" x="-213.8" y="-2099.7" width="3028.4" height="1629.4" fill="#ffffff" stroke="none" />
<textArea id="o16" x="-1415.6" y="-2937.3" width="385.0" font-size="32.0" font-family="open_sans" fill="#ff8934" text-align="left"><b>Задания к функциям</b></textArea>
<ellipse id="o17" cx="-1628.3" cy="-2778.3" rx="31.4" ry="31.4" fill="none" stroke="#ffd700" stroke-width="3" data-content="1" data-text-color="#ffd700" data-font-size="26.5" data-font-family="open_sans" data-text-align="center" data-text-align-vertical="middle" />
<textArea id="o18" x="-1007.3" y="-2809.8" width="1277.6" font-size="26.5" font-family="open_sans" fill="#ff8934" text-align="left">Площадь прямоугольника со сторонами 12 см и y см равна S см².<br/>Выразите формулой зависимость S(y). Для значений y, равных 3; 5; 8, найдите соответствующее значение функции S</textArea>
<textArea id="o19" x="384.4" y="-2790.9" width="3722.1" font-size="26.5" font-family="open_sans" fill="#e1ac18" text-align="left">Трансформер Бамблби движется со скоростью 80 км/ч. За время  t ч он преодолевает расстояние  S км. Задайте формулой зависимость S(t). Найдите значение функции, соответствующее значению аргумента, равному 1,5; 2,2.</textArea>
<ellipse id="o20" cx="-168.7" cy="-2778.3" rx="31.4" ry="31.4" fill="none" stroke="#ffd700" stroke-width="3" data-content="2" data-text-color="#ffd700" data-font-size="26.5" data-font-family="open_sans" data-text-align="center" data-text-align-vertical="middle" />
<textArea id="o21" x="-79.6" y="-1765.6" width="1102.9" font-size="26.5" font-family="open_sans" fill="#ff8934" text-align="left">Каждому натуральному числу n ставится в соответствие остаток r от деления этого числа на 3.<br/>а) Найдите r, если n равно 14, 25, 40, 99.<br/><br/>б) В рассматриваемой функциональной зависимости укажите аргумент:<br/><br/>в) Какова область определения этой функции?<br/><br/>г) Какие числа служат значениями функции?</textArea>
<ellipse id="o22" cx="-1628.3" cy="-2517.5" rx="31.4" ry="31.4" fill="none" stroke="#ffd700" stroke-width="3" data-content="3" data-text-color="#ffd700" data-font-size="26.5" data-font-family="open_sans" data-text-align="center" data-text-align-vertical="middle" />
