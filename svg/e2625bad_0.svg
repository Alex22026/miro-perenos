<textArea id="o56" x="-2442.7" y="-438.1" width="2848.4" font-size="26.5" font-family="open_sans" fill="#e1ac18" text-align="center"><b>Графиком функции</b> называется множество всех точек координатной плоскости, абсциссы которых равны значениям аргумента, а ординаты — соответствующим значениям функции</textArea>
