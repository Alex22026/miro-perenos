<textArea id="o26" x="1361.4" y="-1765.6" width="3320.2" font-size="26.5" font-family="open_sans" fill="#e1ac18" text-align="left">Юный исследователь Лева собирал данные о том, как меняется давление воды P (в атмосферах) с увеличением глубины погружения h (в метрах) в океане. Результаты его измерений он занес в таблицу:</textArea>
<ellipse id="o27" cx="-172.8" cy="-2499.6" rx="31.4" ry="31.4" fill="none" stroke="#ffd700" stroke-width="3" data-content="4" data-text-color="#ffd700" data-font-size="26.5" data-font-family="open_sans" data-text-align="center" data-text-align-vertical="middle" />
<textArea id="o29" x="1361.4" y="-1439.4" width="1118.7" font-size="26.5" font-family="open_sans" fill="#e1ac18" text-align="left">а) Какое давление воды на глубине 10 метров? 25 метров?<br/><br/>б) На какой глубине давление равно 2,5 атм? 3,0 атм?<br/><br/>в) Сформулируй, как изменяется давление при увеличении глубины погружения.</textArea>
<textArea id="o30" x="-77.1" y="-1107.1" width="1261.6" font-size="26.5" font-family="open_sans" fill="#ff8934" text-align="left"><b>«Гонка на гироскутерах»</b><br/>Друзья Петя и Вова устроили гонку на гироскутерах по парку. Они засекали время и отмечали, какое расстояние проехали. Результаты поездки Пети занесли в таблицу:</textArea>
<ellipse id="o31" cx="-1618.7" cy="-1823.7" rx="31.4" ry="31.4" fill="none" stroke="#ffd700" stroke-width="3" data-content="5" data-text-color="#ffd700" data-font-size="26.5" data-font-family="open_sans" data-text-align="center" data-text-align-vertical="middle" />
<textArea id="o33" x="-94.3" y="-793.2" width="1258.4" font-size="26.5" font-family="open_sans" fill="#ff8934" text-align="left">а) Какое расстояние проехал Петя за 4 минуты? А за 8 минут?<br/><br/>б) За какое время Петя проехал 1.8 км? А 3.0 км?<br/><br/>в) С постоянной ли скоростью двигался Петя? Ответ поясни, используя данные таблицы.</textArea>
