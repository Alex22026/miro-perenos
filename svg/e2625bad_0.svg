<textArea id="o39" x="-1086.3" y="-976.6" width="2062.0" font-size="26.5" font-family="open_sans" fill="#e1ac18" text-align="left">Функция задана формулой <b>y = -3x + 8</b>. Найдите значение функции, соответствующее значению аргумента, равному <b>2; -15; 10</b>.</textArea>
