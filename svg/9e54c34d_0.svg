<rect id="o10" data-shape="round_rectangle" x="-641.9" y="-2021.0" width="1136.2" height="1223.2" fill="#a5d3ff" stroke="#1e90ff" stroke-width="3" data-content="&lt;b&gt;📚 Наши цели&lt;/b&gt;&lt;br/&gt;&lt;br/&gt;Отделить зёрна от плевел: прилагательные от причастий&lt;br/&gt;&lt;br/&gt;Поиграть в детектива и найти пропущенные запятые&lt;br/&gt;&lt;br/&gt;Отрицать неотрицаемое: вспомнить написание не с причастиями и деепричастиями&lt;br/&gt;&lt;br/&gt;Узнать, кто кому служит и что такое служебные части речи" data-text-color="#0f1115" data-font-size="46.8" data-font-family="open_sans" data-text-align="center" data-text-align-vertical="middle" />
