<rect id="o2" data-shape="cloud" x="-3159.3" y="-2215.9" width="906.1" height="567.0" fill="#a5d3ff" stroke="#1e90ff" stroke-width="3" data-content="Привет! Сегодня мы докажем, что русский язык в 7 классе —&lt;b&gt; легко и приятно&lt;/b&gt;" data-text-color="#0f1115" data-font-size="37.4" data-font-family="open_sans" data-text-align="center" data-text-align-vertical="middle" />
<rect id="o3" data-shape="round_rectangle" x="1652.0" y="-1975.4" width="1164.3" height="812.3" fill="#bfdee8" stroke="#008080" stroke-width="3" data-content="🔍 &lt;b&gt;ЗАДАНИЕ 1: Отличие причастий от прилагательных&lt;/b&gt;&lt;br/&gt;&lt;br/&gt;Распределите слова по группам (причастия, отглагольные прилагательные, глаголы)&lt;br/&gt;&lt;br/&gt;Слова: белеющий, белый, белеть, кричащий, крикливый, кричать." data-text-color="#0f1115" data-font-size="46.8" data-font-family="open_sans" data-text-align="center" data-text-align-vertical="middle" />
<rect id="o4" data-shape="round_rectangle" x="536.3" y="-586.3" width="1241.6" height="795.6" fill="#d1e8ef" stroke="#008080" stroke-width="3" data-content="&lt;br/&gt;&lt;b&gt;✍️ ЗАДАНИЕ 2: Обособление причастного и деепричастного оборотов&lt;/b&gt;&lt;br/&gt;&lt;br/&gt;Расставьте знаки препинания, выделите обороты:&lt;br/&gt;&lt;br/&gt;Туман окутавший город к утру рассеялся.&lt;br/&gt;Мальчик увидев собаку громко закричал." data-text-color="#0f1115" data-font-size="46.8" data-font-family="open_sans" data-text-align="center" data-text-align-vertical="middle" />
<rect id="o5" data-shape="round_rectangle" x="-2524.4" y="-495.6" width="1138.5" height="918.5" fill="#d1e8ef" stroke="#008080" stroke-width="3" data-content="🚫 &lt;b&gt;ЗАДАНИЕ 3: Слитное и раздельное написание не&lt;/b&gt;&lt;br/&gt;&lt;br/&gt;Раскройте скобки:&lt;br/&gt;&lt;br/&gt;(Не)навидящий ложь человек&lt;br/&gt;Трава (не)скошена&lt;br/&gt;(Не)замеченная учителем ошибка&lt;br/&gt;(Не)годующий взгляд" data-text-color="#0f1115" data-font-size="46.8" data-font-family="open_sans" data-text-align="center" data-text-align-vertical="middle" />
<rect id="o6" data-shape="round_rectangle" x="-2577.9" y="1491.3" width="1389.8" height="770.5" fill="#d1e8ef" stroke="#008080" stroke-width="3" data-content="🔎 &lt;b&gt;ЗАДАНИЕ 4: Служебные части речи&lt;/b&gt;&lt;br/&gt;&lt;br/&gt;Определите часть речи выделенных слов:&lt;br/&gt;&lt;br/&gt;Он пришёл, ЧТОБЫ помочь.&lt;br/&gt;Мы договорились НАСЧЁТ поездки.&lt;br/&gt;В ТЕЧЕНИЕ дня пошёл дождь.&lt;br/&gt;ЧТО БЫ мне почитать?&lt;br/&gt;Он сделал ТО ЖЕ самое." data-text-color="#0f1115" data-font-size="46.8" data-font-family="open_sans" data-text-align="center" data-text-align-vertical="middle" />
<rect id="o8" data-shape="cloud" x="-71.2" y="1474.3" width="1350.9" height="1142.7" fill="#a5d3ff" stroke="#1e90ff" stroke-width="3" data-content="🎯 &lt;b&gt;ИТОГ УРОКА&lt;/b&gt;&lt;br/&gt;&lt;br/&gt;💪 Ты отлично справился со сложными темами!" data-text-color="#0f1115" data-font-size="84.2" data-font-family="open_sans" data-text-align="center" data-text-align-vertical="middle" />
