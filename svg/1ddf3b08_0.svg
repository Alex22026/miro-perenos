<textArea id="o123" x="-635.6" y="-1073.2" width="868.6" font-size="14.0" font-family="open_sans" fill="#1a1a1a" text-align="left">Запишите в виде неравенства и числового промежутка множество чисел, изображенное на рисунке:  </textArea>
<image id="o124" data-type="image" href="https://storage.yandexcloud.net/sboard-whiteboard-prod/images/f7de04b0-247a-429a-a72c-54474be5b1b27c9036a7-2643-4da7-a361-d4fc1baabe43fac44d5a-f939-4bd7-a81a-c0eccf79e688a7fb1d48-78b5-4c11-9c98-dc32e35980cd/clipboard-file.png" x="75.7" y="615.2" width="149.2" height="90.4" />
<image id="o125" data-type="image" href="https://raw.githubusercontent.com/Alex22026/miro-perenos/main/img/3191f2b54665fc1e31e3.jpg" x="-438.0" y="-1019.7" width="314.4" height="52.5" />
