<svg xmlns="http://www.w3.org/2000/svg">
<textArea id="o1" x="-1387.8" y="-1150.6" width="134.3" font-size="16.9" font-family="open_sans" fill="#8822f4" text-align="left"><b>ПРОМЕЖУТКИ</b></textArea>
<rect id="o2" data-shape="rectangle" x="-1392.7" y="-371.1" width="516.3" height="1521.8" fill="#ffffff" stroke="none" />
<textArea id="o3" x="-1392.7" y="-1066.6" width="551.7" font-size="14.0" font-family="open_sans" fill="#8822f4" text-align="left">Нам дано двойное неравенства a &lt; x &lt; b<br/><br/>Подобную запись можно расписать в виде интервала. Отметим на координатной прямой точки a;b</textArea>
<ellipse id="o6" cx="-1473.0" cy="-980.5" rx="4.0" ry="4.0" fill="#8822f4" stroke="#8822f4" stroke-width="3" />
<ellipse id="o7" cx="-1329.2" cy="-980.5" rx="4.0" ry="4.0" fill="#8822f4" stroke="#8822f4" stroke-width="3" />
<textArea id="o8" x="-1466.0" y="-972.8" width="40.0" font-size="14.0" font-family="open_sans" fill="#8822f4" text-align="left">a</textArea>
<textArea id="o9" x="-1320.3" y="-972.8" width="40.0" font-size="14.0" font-family="open_sans" fill="#8822f4" text-align="left">b</textArea>
<textArea id="o10" x="-1390.1" y="-912.9" width="757.7" font-size="14.0" font-family="open_sans" fill="#000000" text-align="left">Возьмем точку x расположенную между a и b. Сделать это можно по-разному. Например:</textArea>
<ellipse id="o12" cx="-1472.5" cy="-864.8" rx="4.0" ry="4.0" fill="#8822f4" stroke="#8822f4" stroke-width="3" />
<ellipse id="o13" cx="-1328.7" cy="-864.8" rx="4.0" ry="4.0" fill="#8822f4" stroke="#8822f4" stroke-width="3" />
<textArea id="o14" x="-1465.5" y="-857.1" width="40.0" font-size="14.0" font-family="open_sans" fill="#8822f4" text-align="left">a</textArea>
<textArea id="o15" x="-1319.8" y="-857.1" width="40.0" font-size="14.0" font-family="open_sans" fill="#8822f4" text-align="left">b</textArea>
<ellipse id="o16" cx="-1418.4" cy="-864.8" rx="4.0" ry="4.0" fill="#8822f4" stroke="#8822f4" stroke-width="3" />
<textArea id="o17" x="-1411.1" y="-857.1" width="40.0" font-size="14.0" font-family="open_sans" fill="#8822f4" text-align="left">х</textArea>
<ellipse id="o19" cx="-1471.4" cy="-806.2" rx="4.0" ry="4.0" fill="#8822f4" stroke="#8822f4" stroke-width="3" />
<ellipse id="o20" cx="-1327.6" cy="-806.2" rx="4.0" ry="4.0" fill="#8822f4" stroke="#8822f4" stroke-width="3" />
<textArea id="o21" x="-1464.4" y="-798.5" width="40.0" font-size="14.0" font-family="open_sans" fill="#8822f4" text-align="left">a</textArea>
<textArea id="o22" x="-1318.7" y="-798.5" width="40.0" font-size="14.0" font-family="open_sans" fill="#8822f4" text-align="left">b</textArea>
<ellipse id="o23" cx="-1360.2" cy="-806.2" rx="4.0" ry="4.0" fill="#8822f4" stroke="#8822f4" stroke-width="3" />
<textArea id="o24" x="-1351.3" y="-801.3" width="40.0" font-size="14.0" font-family="open_sans" fill="#8822f4" text-align="left">х</textArea>
<ellipse id="o26" cx="-1474.8" cy="-752.1" rx="4.0" ry="4.0" fill="#8822f4" stroke="#8822f4" stroke-width="3" />
<ellipse id="o27" cx="-1331.1" cy="-752.1" rx="4.0" ry="4.0" fill="#8822f4" stroke="#8822f4" stroke-width="3" />
<textArea id="o28" x="-1467.8" y="-744.5" width="40.0" font-size="14.0" font-family="open_sans" fill="#8822f4" text-align="left">a</textArea>
<textArea id="o29" x="-1322.2" y="-744.5" width="40.0" font-size="14.0" font-family="open_sans" fill="#8822f4" text-align="left">b</textArea>
<ellipse id="o30" cx="-1401.6" cy="-752.1" rx="4.0" ry="4.0" fill="#8822f4" stroke="#8822f4" stroke-width="3" />
<textArea id="o31" x="-1394.1" y="-747.3" width="40.0" font-size="14.0" font-family="open_sans" fill="#8822f4" text-align="left">х</textArea>
<textArea id="o32" x="-1392.7" y="-655.7" width="531.4" font-size="14.0" font-family="open_sans" fill="#000000" text-align="left">Множество всех чисел, удовлетворяющих условию a &lt; x &lt; b,<br/>изображается на координатной прямой отрезком, ограниченным<br/>точками с координатами a и b. Это множество называют <b>числовым отрезком или просто отрезком</b></textArea>
<image id="o33" data-type="image" href="https://storage.yandexcloud.net/sboard-whiteboard-prod/images/93a1e008-1dff-4a0c-ad35-5908eea48c0adf45bf82-ef47-4dca-82dc-0a60a1af671c74f5a078-98ce-4091-ab0d-c80ac23d1fba8cc1539c-60d9-4b39-9988-10e1b0e40d44/clipboard-file.png" x="-1405.8" y="-600.8" width="96.1" height="35.9" />
<textArea id="o36" x="-1391.3" y="-445.3" width="534.4" font-size="14.0" font-family="open_sans" fill="#000000" text-align="left">Множество чисел, удовлетворяющих условию а &lt; x &lt; b, называют<br/><b>интервалом </b>и обозначают так:</textArea>
<image id="o37" data-type="image" href="https://storage.yandexcloud.net/sboard-whiteboard-prod/images/6bdd9f13-740c-48c1-ac53-9b4e579ed53dc00a4390-9c8c-4e4d-91e1-932ac36fc7c2b952dcf8-4fa6-4c03-ac94-51943c6506e44f2a9918-47a7-4ea0-91fd-c58f529eefa5/clipboard-file.png" x="-1404.3" y="-412.9" width="103.2" height="33.4" />
<textArea id="o38" x="-1476.9" y="-381.9" width="415.8" font-size="14.0" font-family="open_sans" fill="#000000" text-align="left">На координатной прямой это выглядит вот так: </textArea>
<textArea id="o39" x="-1477.4" y="-572.8" width="415.8" font-size="14.0" font-family="open_sans" fill="#000000" text-align="left">На координатной прямой это выглядит вот так: </textArea>
<ellipse id="o41" cx="-1455.0" cy="-516.6" rx="4.0" ry="4.0" fill="#8822f4" stroke="#8822f4" stroke-width="3" />
<ellipse id="o42" cx="-1311.2" cy="-516.6" rx="4.0" ry="4.0" fill="#8822f4" stroke="#8822f4" stroke-width="3" />
<textArea id="o43" x="-1448.0" y="-508.9" width="40.0" font-size="14.0" font-family="open_sans" fill="#8822f4" text-align="left">a</textArea>
<textArea id="o44" x="-1302.4" y="-508.9" width="40.0" font-size="14.0" font-family="open_sans" fill="#8822f4" text-align="left">b</textArea>
<ellipse id="o49" cx="-1454.6" cy="-326.6" rx="4.0" ry="4.0" fill="none" stroke="#8822f4" stroke-width="3" />
<ellipse id="o50" cx="-1311.2" cy="-327.3" rx="4.0" ry="4.0" fill="none" stroke="#8822f4" stroke-width="3" />
<textArea id="o51" x="-1448.0" y="-319.6" width="40.0" font-size="14.0" font-family="open_sans" fill="#8822f4" text-align="left">a</textArea>
<textArea id="o52" x="-1302.4" y="-319.6" width="40.0" font-size="14.0" font-family="open_sans" fill="#8822f4" text-align="left">b</textArea>
<textArea id="o57" x="-1451.8" y="-309.4" width="175.3" font-size="7.0" font-family="open_sans" fill="#1a1a1a" text-align="left">светлые кружочки<br/>означают, что число не входит в этот интервал</textArea>
<textArea id="o59" x="-1390.6" y="-223.2" width="553.0" font-size="14.0" font-family="open_sans" fill="#000000" text-align="left">Множества чисел х, для которых выполняются двойные неравенства<br/>а &lt; x &lt; b или а &lt; x &lt; b, называют <b>полуинтервалами</b> и обозначают: </textArea>
<image id="o60" data-type="image" href="https://storage.yandexcloud.net/sboard-whiteboard-prod/images/be62da7c-0765-4ae1-a4fa-ae98b1166ca2fcfd11db-3dec-4f85-a96a-77ce44136df64af71269-b78f-4cb5-b51d-6a0a7e3fd20e0b023797-f0df-4626-a5b2-8fa0a61cbc93/clipboard-file.png" x="-1399.7" y="-186.0" width="222.7" height="33.3" />
<textArea id="o61" x="-1481.1" y="-149.6" width="415.8" font-size="14.0" font-family="open_sans" fill="#000000" text-align="left">На координатной прямой это выглядит вот так: </textArea>
<ellipse id="o63" cx="-1463.5" cy="-108.5" rx="4.0" ry="4.0" fill="#8822f4" stroke="#8822f4" stroke-width="3" />
<ellipse id="o64" cx="-1319.7" cy="-108.5" rx="4.0" ry="4.0" fill="none" stroke="#8822f4" stroke-width="3" />
<textArea id="o65" x="-1456.4" y="-100.9" width="40.0" font-size="14.0" font-family="open_sans" fill="#8822f4" text-align="left">a</textArea>
<textArea id="o66" x="-1310.8" y="-100.9" width="40.0" font-size="14.0" font-family="open_sans" fill="#8822f4" text-align="left">b</textArea>
<ellipse id="o71" cx="-1463.5" cy="-49.8" rx="4.0" ry="4.0" fill="none" stroke="#8822f4" stroke-width="3" />
<ellipse id="o72" cx="-1319.7" cy="-50.2" rx="4.0" ry="4.0" fill="#8822f4" stroke="#8822f4" stroke-width="3" />
<textArea id="o73" x="-1456.4" y="-42.6" width="40.0" font-size="14.0" font-family="open_sans" fill="#8822f4" text-align="left">a</textArea>
<textArea id="o74" x="-1310.8" y="-42.6" width="40.0" font-size="14.0" font-family="open_sans" fill="#8822f4" text-align="left">b</textArea>
<textArea id="o80" x="-1393.0" y="359.8" width="693.0" font-size="14.0" font-family="open_sans" fill="#000000" text-align="left">Числовые отрезки, интервалы и полуинтервалы называют <b>числовыми промежутками</b></textArea>
<rect id="o81" data-shape="rectangle" x="-127.5" y="-569.9" width="1762.2" height="1126.0" fill="#ffffff" stroke="none" />
<textArea id="o82" x="-811.5" y="-1145.0" width="236.7" font-size="16.9" font-family="open_sans" fill="#9985ff" text-align="left"><b>Задания на промежутки</b></textArea>
<ellipse id="o83" cx="-937.4" cy="-997.7" rx="22.0" ry="22.0" fill="#ffffff" stroke="#9985ff" stroke-width="3" data-content="1" data-text-color="#9985ff" data-font-size="14.0" data-font-family="open_sans" data-text-align="center" data-text-align-vertical="middle" />
<textArea id="o84" x="-1393.0" y="63.0" width="546.3" font-size="14.0" font-family="open_sans" fill="#333333" text-align="left">Отметим точку a и все точки правее неё ( x &gt; a). Это множество точек называется <b>лучом</b> и обозначается так:<br/><br/><br/> Знак  означает <b>бесконечность</b>, это не число, поэтому квадратной скобки около этого знака быть не может. Аналогично определяется луч, где все числа, меньшие или равные числу a :</textArea>
<image id="o88" data-type="image" href="https://storage.yandexcloud.net/sboard-whiteboard-prod/images/b4fb6f69-4a75-4d75-856e-8ac2d91eed90d82729dc-d975-4db4-a893-d1f80a73d571d45f04ae-6a2e-49f0-8b01-2725be7852d31922c701-5f3c-4a97-bce1-ba4cbc2acbc0/clipboard-file.png" x="-1399.7" y="51.7" width="81.4" height="40.7" />
<image id="o89" data-type="image" href="https://storage.yandexcloud.net/sboard-whiteboard-prod/images/76587a5d-bf25-482e-87ad-9a839d080a3827cc303a-f924-48d6-9d89-da7250be82945f0ce94b-a89d-4fd7-a9fc-44226d13bfb6b169e735-da44-43f0-af1c-71e1fef4dc7b/clipboard-file.png" x="-1399.7" y="154.7" width="82.2" height="43.4" />
<textArea id="o90" x="-1476.9" y="186.4" width="415.8" font-size="14.0" font-family="open_sans" fill="#000000" text-align="left">На координатной прямой это выглядит вот так: </textArea>
<ellipse id="o92" cx="-1456.7" cy="235.5" rx="4.0" ry="4.0" fill="#8822f4" stroke="#8822f4" stroke-width="3" />
<textArea id="o93" x="-1449.7" y="243.2" width="40.0" font-size="14.0" font-family="open_sans" fill="#8822f4" text-align="left">a</textArea>
<ellipse id="o97" cx="-1456.7" cy="302.8" rx="4.0" ry="4.0" fill="#8822f4" stroke="#8822f4" stroke-width="3" />
<textArea id="o98" x="-1449.7" y="310.4" width="40.0" font-size="14.0" font-family="open_sans" fill="#8822f4" text-align="left">a</textArea>
<image id="o101" data-type="image" href="https://raw.githubusercontent.com/Alex22026/miro-perenos/main/img/1f17fc050a14a497d21e.jpg" x="-777.8" y="-1019.5" width="319.0" height="52.9" />
