<ellipse id="o35" cx="-2286.2" cy="-257.0" rx="33.2" ry="33.2" fill="none" stroke="#dc143c" stroke-width="3" data-content="5" data-text-color="#dc143c" data-font-size="28.0" data-font-family="open_sans" data-text-align="center" data-text-align-vertical="middle" />
