<textArea id="o19" x="4166.8" y="-1587.5" width="5674.3" font-size="81.2" font-family="open_sans" fill="#0f1115" text-align="center"><b>🟢 Н и НН В СУФФИКСАХ ПРИЛАГАТЕЛЬНЫХ</b></textArea>
<rect id="o20" data-shape="rectangle" x="-4659.5" y="-100.0" width="2435.2" height="2786.5" fill="#f6f6f6" stroke="#f6f6f6" stroke-width="3" data-content="&lt;b&gt;1. ВСТАВЬ ПРОПУЩЕННЫЕ БУКВЫ (БАЗОВЫЙ УРОВЕНЬ)&lt;/b&gt;&lt;br/&gt;&lt;br/&gt;&lt;b&gt;1.1. Вставьте Н или НН.&lt;/b&gt;&lt;br/&gt;Глиня…ый кувшин&lt;br/&gt;Стекля…ая ваза&lt;br/&gt;Деревя…ый стул&lt;br/&gt;Оловя…ый солдатик&lt;br/&gt;Кожа…ая куртка&lt;br/&gt;Серебря…ая ложка&lt;br/&gt;Румя…ые щёки&lt;br/&gt;Ю…ый натуралист&lt;br/&gt;Ветре…ый день&lt;br/&gt;Тума…ое утро&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;b&gt;1.2. Вставьте Н или НН.&lt;/b&gt;&lt;br/&gt;Карти…ая галерея&lt;br/&gt;Стари…ые часы&lt;br/&gt;Каме…ый дом&lt;br/&gt;Песча…ый берег&lt;br/&gt;Льня…ое полотенце&lt;br/&gt;Журавли…ый клин&lt;br/&gt;Лебеди…ая верность&lt;br/&gt;Соловьи…ая трель&lt;br/&gt;Орли…ый взгляд&lt;br/&gt;Мыши…ая возня" data-text-color="#0f1115" data-font-size="56.7" data-font-family="open_sans" data-text-align="left" data-text-align-vertical="top" />
<textArea id="o21" x="2028.2" y="-1388.5" width="354.7" font-size="164.2" font-family="open_sans" fill="#000000" text-align="left">💥</textArea>
<rect id="o22" data-shape="rectangle" x="-2175.3" y="-28.9" width="2295.1" height="2913.9" fill="#f6f6f6" stroke="#f6f6f6" stroke-width="3" data-content="&lt;b&gt;2. РАСПРЕДЕЛИ ПО КОЛОНКАМ&lt;/b&gt;&lt;br/&gt;&lt;br/&gt;&lt;b&gt;2.1. Распределите слова в три колонки:&lt;/b&gt;&lt;br/&gt;&lt;br/&gt;&lt;b&gt;1) Н&lt;/b&gt; &lt;b&gt;2) НН&lt;/b&gt; &lt;b&gt;3) исключения (запомнить)&lt;/b&gt;&lt;br/&gt;&lt;i&gt;Слова:&lt;/i&gt; кожаный, стеклянный, ветреный, юный, серебряный, оловянный, румяный, деревянный, глиняный, свиной, багряный.&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;b&gt;2.2. Распределите слова в две колонки:&lt;/b&gt;&lt;br/&gt;&lt;br/&gt;&lt;b&gt;1) образованы с помощью суффикса -Н-&lt;/b&gt; &lt;b&gt;2) образованы с помощью суффикса -ЕНН-&lt;/b&gt;&lt;br/&gt;&lt;i&gt;Слова:&lt;/i&gt; каменный, торжественный, лимонный, искусственный, туманный, общественный, старинный, соломенный, традиционный, утренний." data-text-color="#0f1115" data-font-size="56.7" data-font-family="open_sans" data-text-align="left" data-text-align-vertical="middle" />
<rect id="o23" data-shape="rectangle" x="189.5" y="-101.8" width="2021.1" height="2723.3" fill="#f6f6f6" stroke="#f6f6f6" stroke-width="3" data-content="&lt;b&gt;3. ОБРАЗУЙ ПРИЛАГАТЕЛЬНЫЕ&lt;/b&gt;&lt;br/&gt;&lt;br/&gt;&lt;b&gt;3.1. Образуйте прилагательные с помощью указанных суффиксов.&lt;/b&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;b&gt;3.2. Образуйте прилагательные от данных слов.&lt;/b&gt;&lt;br/&gt;&lt;br/&gt;революция → &lt;br/&gt;искусство → &lt;br/&gt;хозяйство → &lt;br/&gt;экскурсия → &lt;br/&gt;торжество → &lt;br/&gt;традиция → &lt;br/&gt;станция →  &lt;br/&gt;солома → &lt;br/&gt;клюква → &lt;br/&gt;песок → " data-text-color="#0f1115" data-font-size="56.7" data-font-family="open_sans" data-text-align="left" data-text-align-vertical="middle" />
<rect id="o24" data-shape="rectangle" x="4784.2" y="-765.4" width="2142.0" height="1399.0" fill="#f6f6f6" stroke="#f6f6f6" stroke-width="3" data-content="&lt;br/&gt;&lt;b&gt;5. РАБОТА С ТЕКСТОМ&lt;/b&gt;&lt;br/&gt;&lt;br/&gt;&lt;b&gt;5.1. Вставьте пропущенные буквы.&lt;/b&gt;&lt;br/&gt;&lt;b&gt;Осен…ий лес&lt;/b&gt;&lt;br/&gt;Наступила поз…яя осень. Утре…ий туман стелился над рекой. Ветре…ый день сменился безветре…ым вечером. Деревя…ая лодка тихо покачивалась на воде. На песча…ом берегу лежали соломе…ые тюки. Вдали виднелся стари…ый дом с каме…ой пристройкой. Его оловя…ая крыша блестела в лучах заходящего солнца. Глиня…ые горшки на крыльце были покрыты инеем. Торжестве…ая тишина опустилась на землю. Казалось, сама природа замерла в ожидании чего-то необыкнове…ого." data-text-color="#0f1115" data-font-size="56.7" data-font-family="open_sans" data-text-align="left" data-text-align-vertical="middle" />
<textArea id="o25" x="4403.4" y="1451.3" width="341.7" font-size="158.2" font-family="open_sans" fill="#0f1115" text-align="center"><b>👁</b></textArea>
<textArea id="o26" x="6635.5" y="-1407.5" width="341.7" font-size="158.2" font-family="open_sans" fill="#0f1115" text-align="center"><b>🙏🏻</b></textArea>
<rect id="o27" data-shape="rectangle" x="2475.1" y="-126.7" width="2246.1" height="2623.1" fill="#f6f6f6" stroke="#f6f6f6" stroke-width="3" data-content="&lt;b&gt;4. НАЙДИ И ИСПРАВЬ ОШИБКУ&lt;/b&gt;&lt;br/&gt;&lt;br/&gt;&lt;b&gt;4.1. В каждом предложении есть одна ошибка. Найдите и исправьте её.&lt;/b&gt;&lt;br/&gt;Стекляный стакан стоял на столе.&lt;br/&gt;Это был деревяный дом.&lt;br/&gt;На улице ветренный день.&lt;br/&gt;Она купила кожанную куртку.&lt;br/&gt;У неё румянные щёки.&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;b&gt;4.2. Найдите ошибки в написании Н/НН. Если ошибок нет, оставьте предложение без изменений.&lt;/b&gt;&lt;br/&gt;Картина была написана масляными красками. &lt;br/&gt;Мы гуляли по песчанному пляжу.&lt;br/&gt;Учительница была взволнована новостью.&lt;br/&gt;Он был очень юнный.&lt;br/&gt;На стене висела картинная галерея. " data-text-color="#0f1115" data-font-size="56.7" data-font-family="open_sans" data-text-align="left" data-text-align-vertical="middle" />
<textArea id="o28" x="11183.0" y="-1407.5" width="471.1" font-size="218.1" font-family="open_sans" fill="#0f1115" text-align="center"><b>🫶🏻</b></textArea>
<textArea id="o29" x="8992.8" y="1189.2" width="396.5" font-size="183.6" font-family="open_sans" fill="#0f1115" text-align="center"><b>✌🏻</b></textArea>
<rect id="o30" data-shape="rectangle" x="7052.1" y="3.4" width="2142.0" height="2739.3" fill="#f6f6f6" stroke="#f6f6f6" stroke-width="3" data-content="&lt;br/&gt;&lt;b&gt;6. КРАТКИЕ ПРИЛАГАТЕЛЬНЫЕ&lt;/b&gt;&lt;br/&gt;&lt;br/&gt;&lt;b&gt;6.1. Образуйте краткие формы (ж.р., ед.ч.) от данных прилагательных.&lt;/b&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;b&gt;6.2. Вставьте Н или НН в краткие формы.&lt;/b&gt;&lt;br/&gt;&lt;br/&gt;Местность пусты…а.&lt;br/&gt;Девушка взволнова…а.&lt;br/&gt;Небо безлу…о.&lt;br/&gt;Дорога дли…а.&lt;br/&gt;Его ответы увере…ы.&lt;br/&gt;Её щёки румя…ы.&lt;br/&gt;Погода ветре…а.&lt;br/&gt;Решение было обдума…о.&lt;br/&gt;Природа величестве…а.&lt;br/&gt;Эти люди опас…ы." data-text-color="#0f1115" data-font-size="56.7" data-font-family="open_sans" data-text-align="left" data-text-align-vertical="middle" />
<textArea id="o31" x="13568.2" y="1247.6" width="479.5" font-size="222.0" font-family="open_sans" fill="#0f1115" text-align="left"><b>🔥</b></textArea>
