<textArea id="o42" x="37.4" y="799.5" width="704.0" font-size="27.4" font-family="open_sans" fill="#9acd32" text-align="left">Упростите выражение и найдите значение:</textArea>
<textArea id="o43" x="132.0" y="851.1" width="835.9" font-size="27.4" font-family="open_sans" fill="#19572a" text-align="left">а) (4a − 2) − (3 − 6a)  при a = 0,5</textArea>
