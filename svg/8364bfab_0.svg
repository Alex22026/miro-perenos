<textArea id="o20" x="-16622.0" y="-2468.6" width="6363.1" font-size="249.0" font-family="open_sans" fill="#0f1115" text-align="left"><b>📘 ПРАВОПИСАНИЕ НЕ С ПРИЛАГАТЕЛЬНЫМИ</b></textArea>
<textArea id="o21" x="7963.3" y="-2631.1" width="4713.6" font-size="90.3" font-family="open_sans" fill="#0f1115" text-align="center"><b>🟢 ПРАВОПИСАНИЕ НЕ С ПРИЛАГАТЕЛЬНЫМИ</b></textArea>
<rect id="o22" data-shape="rectangle" x="-3314.1" y="-969.3" width="2706.0" height="2584.1" fill="#f6f6f6" stroke="#f6f6f6" stroke-width="3" data-content="&lt;br/&gt;&lt;br/&gt;&lt;b&gt;Упражнение 1. «Распределительный диктант»&lt;/b&gt;&lt;br/&gt;&lt;br/&gt;&lt;b&gt;Слитно&lt;/b&gt; и &lt;b&gt;Раздельно,&lt;/b&gt; графически объясняя выбор (выделите приставку, подчеркните противопоставление и т.д.).&lt;br/&gt;&lt;br/&gt;(Не)ряшливый вид&lt;br/&gt;(Не)высокий, а низкий дом&lt;br/&gt;Вовсе (не)интересный фильм&lt;br/&gt;(Не)оловянный солдатик&lt;br/&gt;(Не)глубокая, но холодная река&lt;br/&gt;(Не)лепый поступок&lt;br/&gt;(Не)широкая, а узкая тропа" data-text-color="#0f1115" data-font-size="63.0" data-font-family="open_sans" data-text-align="left" data-text-align-vertical="top" />
<textArea id="o23" x="6513.5" y="-2349.4" width="394.1" font-size="182.5" font-family="open_sans" fill="#000000" text-align="left">💥</textArea>
<rect id="o24" data-shape="rectangle" x="-469.2" y="-961.0" width="2777.4" height="2567.5" fill="#f6f6f6" stroke="#f6f6f6" stroke-width="3" data-content="&lt;b&gt;Упражнение 2. «Редактор» &lt;/b&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;Найдите и исправьте ошибки в написании &lt;b&gt;НЕ с прилагательными&lt;/b&gt;.&lt;br/&gt;&lt;br/&gt;Передо мной стоял (не)знакомый мальчик. Он был (не)высокого роста, но очень плечист. Его лицо было отнюдь (не)красивым, но оно казалось мне необыкновенно привлекательным. Взгляд его был недетски серьёзным. Это был (не)веселый, а задумчивый ребенок. Одежда его была (не)броская, но аккуратная." data-text-color="#0f1115" data-font-size="63.0" data-font-family="open_sans" data-text-align="left" data-text-align-vertical="middle" />
<rect id="o25" data-shape="rectangle" x="2479.7" y="-961.0" width="2725.2" height="2567.5" fill="#f6f6f6" stroke="#f6f6f6" stroke-width="3" data-content="&lt;b&gt;Упражнение 3. «Трансформация»&lt;/b&gt;&lt;br/&gt;&lt;br/&gt;Замените словосочетания, изменив условия так, чтобы написание стало раздельным. Используйте слова &lt;b&gt;далеко, вовсе, отнюдь, ничуть, нисколько&lt;/b&gt; (выбирайте подходящее по смыслу).&lt;br/&gt;&lt;br/&gt;&lt;b&gt;Образец:&lt;/b&gt;&lt;br/&gt;&lt;i&gt;Неширокая река&lt;/i&gt; → &lt;i&gt;отнюдь не широкая река&lt;/i&gt;&lt;br/&gt;&lt;br/&gt;Неинтересная книга → …&lt;br/&gt;Несложное задание → …&lt;br/&gt;Неплохой ответ → …&lt;br/&gt;Невысокий человек → …&lt;br/&gt;Нетрудная задача → …&lt;br/&gt;Недорогой подарок → …&lt;br/&gt;Неглупый мальчик → …&lt;br/&gt;Некрасивый поступок → …&lt;br/&gt;Недолгий разговор → …&lt;br/&gt;Небольшая сумма → …&lt;br/&gt;Неверное решение → …&lt;br/&gt;Невежливый ответ → …" data-text-color="#0f1115" data-font-size="63.0" data-font-family="open_sans" data-text-align="left" data-text-align-vertical="middle" />
<rect id="o26" data-shape="rectangle" x="9246.2" y="-961.0" width="3371.2" height="2567.5" fill="#f6f6f6" stroke="#f6f6f6" stroke-width="3" data-content="&lt;br/&gt;&lt;b&gt;Упражнение 5. «Найди лишнее» &lt;/b&gt;&lt;br/&gt;&lt;br/&gt;&lt;b&gt;Задание:&lt;/b&gt; В каждой строчке найдите &lt;b&gt;«лишнее»&lt;/b&gt; слово (или словосочетание), которое отличается по написанию от остальных. Объясните свой выбор.&lt;br/&gt;&lt;br/&gt;1. (Не)весёлый, (не)ряшливый, (не)широкий, (не)настный.&lt;br/&gt;&lt;i&gt;Лишнее: …&lt;/i&gt;&lt;br/&gt;2. (Не)высокий, а низкий; (не)дорогой, но красивый; (не)лепый; (не)глубокий.&lt;br/&gt;&lt;i&gt;Лишнее: …&lt;/i&gt;&lt;br/&gt;3. Вовсе (не)интересный, (не)внимательный, (не)приятный, (не)брежный.&lt;br/&gt;&lt;i&gt;Лишнее: …&lt;/i&gt;&lt;br/&gt;4. (Не)громкий, а тихий; (не)глупый; (не)взрачный; (не)лёгкий.&lt;br/&gt;&lt;i&gt;Лишнее: …&lt;/i&gt;&lt;br/&gt;5. (Не)большая, но просторная комната; (не)дорогая вещь; (не)настная погода; (не)уклюжий медвежонок.&lt;br/&gt;&lt;i&gt;Лишнее: …&lt;/i&gt;&lt;br/&gt;6. Отнюдь (не)трудный; (не)сложный; (не)злой; (не)ряшливый.&lt;br/&gt;&lt;i&gt;Лишнее: …&lt;/i&gt;&lt;br/&gt;7. (Не)долгий, а короткий; (не)длинный, но широкий; (не)лёгкая ноша; (не)вежливый ответ.&lt;br/&gt;&lt;i&gt;Лишнее: …&lt;/i&gt;" data-text-color="#0f1115" data-font-size="63.0" data-font-family="open_sans" data-text-align="left" data-text-align-vertical="middle" />
<textArea id="o27" x="9343.1" y="-2339.9" width="379.7" font-size="175.8" font-family="open_sans" fill="#0f1115" text-align="center"><b>👁</b></textArea>
<textArea id="o28" x="12327.8" y="-2372.6" width="379.7" font-size="175.8" font-family="open_sans" fill="#0f1115" text-align="center"><b>🙏🏻</b></textArea>
<rect id="o29" data-shape="rectangle" x="5708.3" y="-961.0" width="3103.2" height="2567.5" fill="#f6f6f6" stroke="#f6f6f6" stroke-width="3" data-content="&lt;b&gt;Упражнение 4. «Логика» &lt;/b&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;Раскройте скобки, подберите подходящий союз (&lt;i&gt;а&lt;/i&gt; или &lt;i&gt;но&lt;/i&gt;). Объясните написание &lt;i&gt;не&lt;/i&gt; с прилагательным (слитно или раздельно).&lt;br/&gt;&lt;br/&gt;Это был (не)знакомый, … давно забытый старый приятель. &lt;i&gt;(НО)&lt;/i&gt;&lt;br/&gt;Это был (не)знакомый, … совершенно чужой человек. &lt;i&gt;(А)&lt;/i&gt;&lt;br/&gt;Дом (не)высокий, … уютный. (НО)&lt;br/&gt;Дом (не)высокий, … низкий. (А)&lt;br/&gt;Платье (не)дорогое, … красивое.&lt;br/&gt;Платье (не)дорогое, … дешёвое.&lt;br/&gt;Фильм (не)интересный, … очень познавательный.&lt;br/&gt;Фильм (не)интересный, … скучный.&lt;br/&gt;Ответ (не)точный, … правильный по сути.&lt;br/&gt;Ответ (не)точный, … ошибочный.&lt;br/&gt;Человек (не)злой, … вспыльчивый.&lt;br/&gt;Человек (не)злой, … добрый." data-text-color="#0f1115" data-font-size="63.0" data-font-family="open_sans" data-text-align="left" data-text-align-vertical="middle" />
<textArea id="o30" x="19303.1" y="-2420.1" width="523.5" font-size="242.3" font-family="open_sans" fill="#0f1115" text-align="center"><b>🫶🏻</b></textArea>
<image id="o31" data-type="image" href="https://storage.yandexcloud.net/sboard-whiteboard-prod/images/ae8e3e34-a3dd-4589-b7e3-c30a053e8041778ecd5b-33ce-46ba-badc-12d7930b6eeddac7cae0-7a4f-4ef5-b4c0-3e5efd8f711efe63a5cf-1ac2-4b9d-9ebb-84f704497e0b/image.png" x="-5768.8" y="1689.9" width="1480.6" height="2362.4" />
<image id="o32" data-type="image" href="https://storage.yandexcloud.net/sboard-whiteboard-prod/images/8bbef257-0d52-46d2-adde-1fabb05ecd0bf6b42d72-99cb-445e-9d5c-b1bd9d5527269a3023fc-55a8-4481-921d-26b93365afeeafa32670-ddcc-4204-b843-8281419394fd/image.png" x="18153.8" y="1819.6" width="1623.6" height="2103.1" />
<image id="o33" data-type="image" href="https://storage.yandexcloud.net/sboard-whiteboard-prod/images/735c03ed-b6fc-47d2-af3f-0b3509c36d7937fb4557-5d22-4aed-896a-23168795586a6c066559-e3b4-4342-a3e4-96e8ebb18972a958952a-2e0f-4e9d-9446-3c4a9135deee/image.png" x="-2528.8" y="-1698.8" width="503.4" height="503.4" />
<textArea id="o34" x="15697.1" y="-2392.7" width="440.6" font-size="204.0" font-family="open_sans" fill="#0f1115" text-align="center"><b>✌🏻</b></textArea>
<textArea id="o35" x="-13616.1" y="-1171.4" width="4687.4" font-size="125.9" font-family="open_sans" fill="#0f1115" text-align="center"><br/><br/><b>Алгоритм «Слитно или раздельно?» (для прилагательных)</b><br/><b>Шаг 1. Смотрим на слово без НЕ.</b><br/>Если слово без <b>НЕ</b> не употребляется (нелепый, ненастный, невзрачный) → <b>Пиши СЛИТНО</b>.<br/><b>Шаг 2. Смотрим на предложение. Есть ли противопоставление с союзом А?</b><br/>Если есть (не большой, <b>а</b> маленький) → <b>Пиши РАЗДЕЛЬНО</b>.<br/><i>Важно!</i> Если союз «НО» (не большой, но уютный), то можно заменить синонимом (маленький) → пиши СЛИТНО.<br/><b>Шаг 3. Смотрим на слова-усилители отрицания:</b><br/>Если есть слова <i>далеко не, вовсе не, отнюдь не, ничуть не, нисколько не</i> → <b>Пиши РАЗДЕЛЬНО</b> (вовсе не интересный фильм).<br/><b>Шаг 4. Нет условий из шагов 2 и 3?</b><br/>Попробуй заменить слово синонимом без НЕ (небольшой = маленький, неглупый = умный) или подбери выражение, близкое по смыслу → <b>Пиши СЛИТНО</b>.</textArea>
<image id="o36" data-type="image" href="https://storage.yandexcloud.net/sboard-whiteboard-prod/images/437b4fa4-279e-459d-a2a9-8f40a5d8d9ffd815a226-f2ef-426f-ae96-0d3157f02b8c93b7bcce-4642-4f4f-8c12-2d770caa1b17f7b947c8-8649-4c6e-bce7-fc24b5eaa177/clipboard-file.png" x="-4708.9" y="647.9" width="3222.7" height="4601.7" />
<rect id="o37" data-shape="rectangle" x="12610.5" y="-184.3" width="2735.2" height="4056.6" fill="#f6f6f6" stroke="#f6f6f6" stroke-width="3" data-content="&lt;br/&gt;&lt;b&gt;Упражнение 6. «Конструктор предложений»&lt;/b&gt;&lt;br/&gt;&lt;br/&gt;&lt;b&gt;Задание:&lt;/b&gt; Составьте по одному предложению на каждую из предложенных схем. Используйте прилагательные из списка или подберите свои.&lt;br/&gt;&lt;br/&gt;&lt;b&gt;Список прилагательных для справок:&lt;/b&gt;&lt;br/&gt;&lt;i&gt;весёлый, глубокий, дорогой, интересный, красивый, лёгкий, низкий, плохой, простой, сладкий, тёплый, умный, хороший, широкий, яркий&lt;/i&gt;&lt;br/&gt;&lt;br/&gt;&lt;b&gt;Схемы для составления предложений:&lt;/b&gt;&lt;br/&gt;&lt;b&gt;Слитное написание (можно заменить синонимом без &lt;/b&gt;&lt;i&gt;&lt;b&gt;не&lt;/b&gt;&lt;/i&gt;&lt;b&gt;).&lt;/b&gt;&lt;br/&gt;&lt;i&gt;Схема:&lt;/i&gt; [Не + прилагательное] + существительное.&lt;br/&gt;&lt;i&gt;Пример:&lt;/i&gt; &lt;b&gt;Неширокая&lt;/b&gt; тропинка вела к реке.&lt;br/&gt;Ваше предложение: …&lt;br/&gt;&lt;b&gt;Раздельное написание (противопоставление с союзом &lt;/b&gt;&lt;i&gt;&lt;b&gt;а&lt;/b&gt;&lt;/i&gt;&lt;b&gt;).&lt;/b&gt;&lt;br/&gt;&lt;i&gt;Схема:&lt;/i&gt; Не + прилагательное, а + прилагательное-антоним.&lt;br/&gt;&lt;i&gt;Пример:&lt;/i&gt; Это был &lt;b&gt;не широкий&lt;/b&gt;, &lt;b&gt;а&lt;/b&gt; узкий проход.&lt;br/&gt;Ваше предложение: …&lt;br/&gt;&lt;b&gt;Слитное написание (союз &lt;/b&gt;&lt;i&gt;&lt;b&gt;но&lt;/b&gt;&lt;/i&gt;&lt;b&gt; не нарушает слитности).&lt;/b&gt;&lt;br/&gt;&lt;i&gt;Схема:&lt;/i&gt; Не + прилагательное, но + прилагательное (или другая часть предложения).&lt;br/&gt;&lt;i&gt;Пример:&lt;/i&gt; Дом был &lt;b&gt;невысокий&lt;/b&gt;, &lt;b&gt;но&lt;/b&gt; очень уютный.&lt;br/&gt;Ваше предложение: …&lt;br/&gt;&lt;b&gt;Раздельное написание (усилитель отрицания).&lt;/b&gt;&lt;br/&gt;&lt;i&gt;Схема:&lt;/i&gt; Усилитель (&lt;i&gt;вовсе, далеко, отнюдь, ничуть, нисколько&lt;/i&gt;) + не + прилагательное.&lt;br/&gt;&lt;i&gt;Пример:&lt;/i&gt; Это был &lt;b&gt;вовсе не интересный&lt;/b&gt; фильм.&lt;br/&gt;Ваше предложение: …&lt;br/&gt;&lt;b&gt;Слитное написание (слово без &lt;/b&gt;&lt;i&gt;&lt;b&gt;не&lt;/b&gt;&lt;/i&gt;&lt;b&gt; не употребляется).&lt;/b&gt;&lt;br/&gt;&lt;i&gt;Схема:&lt;/i&gt; [Не + прилагательное, которое без не не употребляется] + существительное.&lt;br/&gt;&lt;i&gt;Пример:&lt;/i&gt; Стояла &lt;b&gt;ненастная&lt;/b&gt; погода.&lt;br/&gt;Ваше предложение: …" data-text-color="#0f1115" data-font-size="63.0" data-font-family="open_sans" data-text-align="left" data-text-align-vertical="middle" />
<rect id="o38" data-shape="rectangle" x="15637.4" y="-944.9" width="2755.4" height="2535.4" fill="#f6f6f6" stroke="#f6f6f6" stroke-width="3" data-content="&lt;br/&gt;&lt;b&gt;Задание 7. «Мини-сочинение»&lt;/b&gt;&lt;br/&gt;&lt;br/&gt;&lt;b&gt;Задание:&lt;/b&gt; Создай миниатюру (5–7 предложений) на тему «Неожиданная встреча» или «Мой выходной», используя не менее 5 слов на правило «НЕ с прилагательными». &lt;br/&gt;&lt;br/&gt;Постарайтесь использовать разные случаи: слитное написание (синоним, без не не употр.), раздельное (противопоставление, усилители). " data-text-color="#0f1115" data-font-size="63.0" data-font-family="open_sans" data-text-align="left" data-text-align-vertical="middle" />
<textArea id="o39" x="22391.9" y="-2430.6" width="555.0" font-size="257.0" font-family="open_sans" fill="#0f1115" text-align="center"><b>🔥</b></textArea>
