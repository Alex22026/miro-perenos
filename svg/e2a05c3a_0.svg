<svg xmlns="http://www.w3.org/2000/svg">
<rect id="o1" data-shape="rectangle" x="-35274.8" y="-13449.6" width="141019.9" height="49524.3" fill="none" stroke="#000000" stroke-width="8" />
<textArea id="o2" x="-83411.7" y="-31081.7" width="45931.4" font-size="699.3" font-family="open_sans" fill="#1a1a1a" text-align="left">1. После буквы ц обычно пишутся буквы у, а, е: царь, цепочка, цукаты. <br/>2. Буквы э, ю, я после ц встречаются только в иноязычных словах: Друцэ, Цюрих, Цяньнань и т. д. <br/>3. После ц пишется о в слове цокать и его производном цокотуха, а также в некоторых иноязычных словах: цоколь, скерцо, цоизит и др. <br/>4. После ц в корне слов пишется буква и: цифровой, цистерна, аттракцион.<br/>5. В суффиксах и окончаниях после ц - под ударением пишется буква о: бойцом, окольцованный; - без ударения пишется буква е: синицей, гарцевать, солнце, сердцем. <br/>6. В окончаниях имён существительных и имён прилагательных после ц пишется ы: птицы, отцы; белолицый, куцый. <br/>7. В суффиксе -ын- имён прилагательных после ц пишется буква ы: курицын, куницын, сестрицын.</textArea>
<rect id="o3" data-type="sticky" x="-57495.4" y="-25673.3" width="12165.9" height="13990.8" data-color="red" data-content="&lt;b&gt;Исключения:&lt;/b&gt; цыган, на цыпочках, цыплёнок, цыц, цыкнуть, цып-цып." />
<textArea id="o4" x="-89806.4" y="-36074.7" width="32118.8" font-size="699.3" font-family="open_sans" fill="#1a1a1a" text-align="left"><b>ПРАВОПИСАНИЕ ГЛАСНЫХ ПОСЛЕ Ц</b></textArea>
<textArea id="o6" x="-86111.3" y="-23630.4" width="45692.3" font-size="699.3" font-family="open_sans" fill="#1a1a1a" text-align="left">В <b>именах собственных</b> в этом суффиксе по традиции возможно написание и: может быть и Вицын, и Вицин.</textArea>
<textArea id="o7" x="-83411.7" y="-5510.3" width="46211.4" font-size="699.3" font-family="open_sans" fill="#1a1a1a" text-align="left">1. После шипящих ж, ш, ч, щ обычно пишутся буквы а, у, и, е. <br/>Пример: жаба, журчать, жимолость, желтизна шалость, шумный, шить, шестнадцать; чаща, чужой, число, честный; щавель, щуплый, щит, щенок. Исключения: брошюра, жюри, парашют и однокоренные им (брошюрованный). А также иноязычные имена собственные, например:Жюли, Шяуляй, Лонжюмо и др. <br/><br/>2. В корне слова после шипящих под ударением пишется... ...(ё), соответствующее звуку [о], если в безударном положении происходит чередование е [о] // e [э]. <br/>Пример: чёрный -черното, дешевый -дешеветь желоб -желоба, жёны - жено. щелочь -щелочной, печенка - печень ...о, если звук [о] не чередуется с [э]. <br/>Пример: жом, крыжовник, шое, шокировать, шорох, капюшон, чопорный, трущобы.<br/><br/>3. В окончаниях имён существительных, имён прилагательных, а также в суффиксах наречий после шипящих.... ...под ударением пишется буква о.<br/>Пример: багажом, малышом, грачом, борщом, большой, чужой, свежо, ...без ударения пишется буква е. <br/>Пример: камуфляжем, плюшем, плачем, рощей, меньшего, свежего, угрожающе. <br/><br/>4. Буква е (ё) всегда пишется <br/>- в окончаниях личных форм глаголов: влечёт, стережешь, <br/>- в предложном падеже местоимения что: о чём, на чём <br/>- в глагольном суффиксе -ёвыва: растушёвывать; <br/>- в суффиксах существительных -ёвк-, -ёр-: путевка, дирижёр <br/>- в суффиксе прилагательных -ён-: толчёный; <br/>- в суффиксе страдательных причастий -ённ-: сожженный. <br/><br/>5. В суффиксах существительных (-ок-, -от-, -онок-) и прилагательных (-ое-) после шипящих под ударением пишется буква о. Пример: башмачок, одежонка алычовый, камышовый</textArea>
<rect id="o8" data-type="sticky" x="-52989.3" y="-13996.9" width="10895.1" height="12529.3" data-color="light_yellow" data-content="Нужно различать написание имён &lt;b&gt;существительных:&lt;/b&gt; (ожог (ноги), поджог (дома)) — и &lt;b&gt;глаголов&lt;/b&gt;: (ожег (ногу), поджет (дом)). Такие написания называются дифференцирующими. " />
<textArea id="o9" x="-83800.2" y="8993.4" width="54923.0" font-size="699.3" font-family="open_sans" fill="#1a1a1a" text-align="left">В зависимости от традиции в суффиксах фамилий на -ое-, -ев-(-ёв-) могут писаться буквы о, е, ё: Грачов, Грачев, Грочёв.</textArea>
<rect id="o10" data-shape="rectangle" x="-44789.3" y="-13693.4" width="35.5" height="48205.8" fill="#000000" stroke="#000000" stroke-width="8" />
<textArea id="o12" x="-24262.6" y="-9980.0" width="36420.1" font-size="699.3" font-family="open_sans" fill="#0f1115" text-align="left"><b>Задание 1.</b><br/>Ц<b>и</b>ркуль, ц<b>и</b>фра, ц<b>ы</b>ган (искл.).<br/>Ц<b>ы</b>кот (искл. «цыкнуть»), ц<b>ы</b>пленок (искл.), акц<b>и</b>я.<br/>На ц<b>ы</b>почках (искл.), ц<b>и</b>новка, ц<b>и</b>трус.<br/><br/><br/><b>Задание 2.</b><br/>Ш<b>ё</b>пот (шепчет), ш<b>о</b>рох (нет чередования), ж<b>ё</b>лтый (желтизна).<br/>Крыж<b>о</b>вник (искл., нет чередования с Е), ж<b>ё</b>лчь (желчный), ч<b>ё</b>рный (чернота).<br/>Пш<b>е</b>но (но пишется через Е, это исключение), ш<b>ё</b>лк (шелка), ш<b>о</b>в (нет чередования).<br/><br/><br/><b>Задание 3.</b><br/>Девч<b>о</b>нка (суффикс -онк- под ударением), сущ<b>о</b>сть (суффикс -ость под ударением), парч<b>о</b>вый (суффикс -ов- под ударением).<br/>Камыш<b>о</b>м (окончание под ударением), плащ<b>о</b>м (окончание под ударением), реш<b>ё</b>тка (суффикс без ударения).<br/>Ухаж<b>ё</b>р (суффикс без ударения), еж<b>о</b>вый (суффикс -ов- под ударением), грош<b>ё</b>вый (суффикс без ударения).<br/><br/><br/><b>Задание 4.</b><br/><b>О:</b> Шов (корень, нет чередования с Е), капюшон (корень, иноязычное), ножом (окончание под ударением), крючок (суффикс под ударением).<br/><b>Ё:</b> Шёпот (корень, шепчет), тушёнка (суффикс от глагола тушить), дирижёр (суффикс без ударения, от дирижировать), бережёт (глагольное окончание, беречь).<br/><br/><br/><b>Задание 5.</b><br/><b>На цыпочках цыплёнок цыганки бежал к циркулю.</b> (Верно: все исключения с Ы после Ц и циркуль с И).<br/><b>Шёлковый</b> капюшон скрывал её лицо. (Шёлка)<br/>На концерте дирижёра мы услышали прекрасный <b>шёпот</b> струн. (Шепчет)<br/>В саду цвели <b>жёлтые</b> акации и розовые <b>цинии</b>. (Желтизна; цинния — от фамилии Цинн, пишется с И).</textArea>
<textArea id="o13" x="17395.8" y="-11944.9" width="35249.7" font-size="699.3" font-family="open_sans" fill="#0f1115" text-align="left"><b>Задание 6.</b><br/>Поджёг (дом) — глагол. Поджог (случайный) — существительное.<br/>Ожёг (руку) — глагол. Ожог (на руке) — существительное.<br/>Пожёг (всю траву) — глагол. (Из-за) пожога (леса) — устаревшая форма сущ., современная норма — <b>пожар</b>.<br/><br/><br/><b>Задание 7.</b><br/>улицы (окончание -ы)<br/>курицын (суффикс -ын)<br/>бойцы (окончание -ы)<br/>синицей (окончание -ей)<br/><br/><br/><b>Задание 8.</b><br/>Ц<b>и</b>кл, ц<b>и</b>клоп (искл.? Нет, иноязычное, пишется И), облиц<b>о</b>вка (суффикс -овк-).<br/>Девч<b>о</b>нка (суффикс под ударением), сгущ<b>ё</b>нка (от глагола сгущать, суффикс без ударения), распаш<b>о</b>нка (суффикс -онк- под ударением).<br/>Стриж<b>о</b>м (окончание под ударением), ц<b>и</b>гейка (от названия местности Циге), дириж<b>ё</b>р (суффикс без ударения).<br/><br/><br/><b>Задание 9.</b><br/>Шёлк — шелка<br/>Чёрный — чернота<br/>Шёрстка — шерсть<br/>Щёлка — щель<br/>Жёлудь — желудёвый (но не от «желтый», это другой корень)<br/><br/><br/><b>Задание 10.</b><br/>Ц<b>и</b>рк развернул св<b>о</b>й пёстр<b>ы</b>й ц<b>и</b>рковой шатёр на окра<b>и</b>не ц<b>и</b>тадели. На манеж выскочил ц<b>ы</b>ган с ц<b>ы</b>плятами и собакой-пуделем. Он лихо ц<b>ы</b>кнул, и ц<b>ы</b>пл<b>е</b>нок встал на ц<b>ы</b>почки. Затем арену заполнили акробаты в обтягивающих трико и атлеты с ш<b>и</b>рокими плечами. Грудь одного из них украшал татуированный морской к<b>о</b>тёнок. Внезапно раздался оглуш<b>и</b>тельный тр<b>е</b>ск, и из-за кул<b>и</b>с показалась девч<b>о</b>нка с ож<b>о</b>гом на щ<b>е</b>ке. Она несла поднос с ч<b>ё</b>рным кофе и сгущ<b>ё</b>нкой. Всё это было частью бл<b>е</b>стящего ш<b>о</b>у!</textArea>
