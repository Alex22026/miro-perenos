<svg xmlns="http://www.w3.org/2000/svg">
<textArea id="o1" x="-1608.5" y="-2682.7" width="493.5" font-size="23.4" font-family="open_sans" fill="#1e90ff" text-align="left"><b>УРАВНЕНИЯ С ДВУМЯ ПЕРЕМЕННЫМИ</b></textArea>
<textArea id="o2" x="-1608.5" y="-2478.7" width="969.6" font-size="19.3" font-family="open_sans" fill="#1e90ff" text-align="center">Линейным уравнением с двумя переменными называется уравнение вида  ax + by = c , где  x и  y  — переменные,  a, b и с — некоторые числа.<br/><br/><br/>Решением уравнения с двумя переменными называется пара значений переменных, обращающая это уравнение в верное числовое равенство.<br/><br/>Уравнение  x - y = 5  при  x = 8, y = 3  обращается в верное равенство  8 - 3 = 5. Говорят, что пара значений переменных  x = 8,  y = 3 является *решением* этого уравнения.</textArea>
<textArea id="o3" x="-1608.5" y="-2224.2" width="1825.3" font-size="19.3" font-family="open_sans" fill="#1e90ff" text-align="center">Если в уравнении перенести слагаемое из одной части в другую, изменив его знак на противоположный, то получится уравнение, равносильное данному</textArea>
<textArea id="o4" x="-1608.5" y="-2057.9" width="1042.7" font-size="19.3" font-family="open_sans" fill="#1e90ff" text-align="center">Рассмотрим уравнение  <br/>5x + 2y = 12<br/>Воспользовавшись свойствами уравнений, выразим одну переменную через другую, например переменную  y  через x. Для этого перенесём слагаемое 5x  в правую часть уравнения, изменив его знак:  <br/>2y = -5x + 12<br/>Если обе части уравнения умножить или разделить на одно и то же отличное от нуля число, то получится уравнение, равносильное данному<br/>Разделим обе части этого уравнения на 2:<br/>y= –2,5x+6</textArea>
<textArea id="o5" x="-1608.5" y="-1836.0" width="1901.9" font-size="19.3" font-family="open_sans" fill="#1e90ff" text-align="center">Графиком уравнения с двумя переменными называется множество всех точек координатной плоскости, координаты которых являются решениями этого уравнения.</textArea>
<image id="o6" data-type="image" href="https://storage.yandexcloud.net/sboard-whiteboard-prod/images/ecea5de7-6e90-4cb2-8e88-d705313f2a4257127903-f042-44b8-a189-d5c51fd46dd32ecbb6b8-0a0c-4ac5-80c7-3af0cd8547ceb40f3eac-f600-445a-a040-6f45c4694cf4/image.png" x="-1608.5" y="-1657.3" width="343.9" height="310.9" />
<textArea id="o7" x="-821.0" y="-2682.7" width="113.4" font-size="23.4" font-family="open_sans" fill="#1e90ff" text-align="center"><b>Задания</b></textArea>
<ellipse id="o8" cx="-888.0" cy="-2546.0" rx="28.6" ry="28.5" fill="#ffffff" stroke="#ffa07a" stroke-width="3" data-content="1" data-text-color="#ffa07a" data-font-size="19.3" data-font-family="open_sans" data-text-align="center" data-text-align-vertical="middle" />
<textArea id="o9" x="-485.7" y="-2574.5" width="970.1" font-size="19.3" font-family="open_sans" fill="#ffa07a" text-align="left">Какие из перечисленных пар чисел (x;y) являются решением уравнения 6x+3y=18?</textArea>
<textArea id="o10" x="-843.4" y="-2506.5" width="102.1" font-size="19.3" font-family="open_sans" fill="#ffa07a" text-align="left">1) (1;4)</textArea>
<textArea id="o11" x="-843.4" y="-2484.7" width="102.1" font-size="19.3" font-family="open_sans" fill="#ffa07a" text-align="left">2) (2;2)</textArea>
<textArea id="o12" x="-843.4" y="-2448.8" width="102.1" font-size="19.3" font-family="open_sans" fill="#ffa07a" text-align="left">3) (3;0)</textArea>
<textArea id="o13" x="-843.4" y="-2413.5" width="102.1" font-size="19.3" font-family="open_sans" fill="#ffa07a" text-align="left">4) (0;6)</textArea>
<textArea id="o14" x="-843.4" y="-2379.1" width="114.9" font-size="19.3" font-family="open_sans" fill="#ffa07a" text-align="left">5) (-1;8)</textArea>
<textArea id="o15" x="924.4" y="-2574.5" width="1672.1" font-size="19.3" font-family="open_sans" fill="#ffa07a" text-align="left">Выразите из данного уравнения переменную y<i>y</i> через x<i>x</i>; используя полученную формулу, найдите три каких-либо решения этого уравнения:</textArea>
<ellipse id="o16" cx="520.5" cy="-2546.0" rx="28.6" ry="28.5" fill="#ffffff" stroke="#ffa07a" stroke-width="3" data-content="2" data-text-color="#ffa07a" data-font-size="19.3" data-font-family="open_sans" data-text-align="center" data-text-align-vertical="middle" />
<textArea id="o17" x="590.1" y="-2513.4" width="140.4" font-size="19.3" font-family="open_sans" fill="#ffa07a" text-align="left">а) 6x+3y=18</textArea>
<textArea id="o18" x="585.0" y="-2462.9" width="127.6" font-size="19.3" font-family="open_sans" fill="#ffa07a" text-align="left">б) 4y−2x=8</textArea>
<textArea id="o19" x="-485.7" y="-1948.3" width="1416.8" font-size="19.3" font-family="open_sans" fill="#ffa07a" text-align="left">Из двухрублёвых и пятирублёвых монет составлена сумма в 35 рублей. Сколько могло быть взято двухрублёвых монет?</textArea>
<ellipse id="o20" cx="-888.0" cy="-1919.8" rx="28.6" ry="28.5" fill="#ffffff" stroke="#ffa07a" stroke-width="3" data-content="3" data-text-color="#ffa07a" data-font-size="19.3" data-font-family="open_sans" data-text-align="center" data-text-align-vertical="middle" />
<ellipse id="o21" cx="520.5" cy="-1919.8" rx="28.6" ry="28.5" fill="#ffffff" stroke="#ffa07a" stroke-width="3" data-content="4" data-text-color="#ffa07a" data-font-size="19.3" data-font-family="open_sans" data-text-align="center" data-text-align-vertical="middle" />
<textArea id="o22" x="670.5" y="-1990.5" width="306.3" font-size="19.3" font-family="open_sans" fill="#ffa07a" text-align="left">Решите с помощью графика</textArea>
<textArea id="o23" x="786.9" y="-1948.3" width="612.7" font-size="19.3" font-family="open_sans" fill="#ffa07a" text-align="left">Принадлежит ли графику уравнения 5x−2y=20 точка:</textArea>
<textArea id="o24" x="572.8" y="-1895.0" width="114.9" font-size="19.3" font-family="open_sans" fill="#ffa07a" text-align="left">а) A(6;5)</textArea>
<textArea id="o25" x="572.8" y="-1845.6" width="114.9" font-size="19.3" font-family="open_sans" fill="#ffa07a" text-align="left">б) B(4;0)</textArea>
<textArea id="o26" x="589.1" y="-1790.3" width="153.2" font-size="19.3" font-family="open_sans" fill="#ffa07a" text-align="left">в) C(−2;−15)</textArea>
<textArea id="o27" x="583.1" y="-1738.5" width="140.4" font-size="19.3" font-family="open_sans" fill="#ffa07a" text-align="left">г) D(0;−10)</textArea>
<image id="o28" data-type="image" href="https://raw.githubusercontent.com/Alex22026/miro-perenos/main/img/1c6e8d8b1a8b99803c31.jpg" x="1357.2" y="-1743.7" width="626.7" height="451.2" />
<textArea id="o29" x="-485.7" y="-1339.3" width="1085.0" font-size="19.3" font-family="open_sans" fill="#ffa07a" text-align="left">Докажите, что графики уравнений 2x+y=0, x−3y=7 и 5x+2y=1 проходят через точку K(1;−2)</textArea>
<ellipse id="o30" cx="-888.0" cy="-1310.8" rx="28.6" ry="28.5" fill="#ffffff" stroke="#ffa07a" stroke-width="3" data-content="5" data-text-color="#ffa07a" data-font-size="19.3" data-font-family="open_sans" data-text-align="center" data-text-align-vertical="middle" />
<image id="o31" data-type="image" href="https://raw.githubusercontent.com/Alex22026/miro-perenos/main/img/1c6e8d8b1a8b99803c31.jpg" x="-639.2" y="-974.5" width="626.7" height="451.2" />
