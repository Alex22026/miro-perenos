<textArea id="o9" x="-2709.3" y="-1342.4" width="948.6" font-size="23.4" font-family="open_sans" fill="#000000" text-align="center">Степенью многочлена стандартного вида называют наибольшую из степеней входящих в него одночленов.<br/>Степенью произвольного многочлена называют степень тождественно равного ему многочлена стандартного вида.</textArea>
<image id="o10" data-type="image" href="https://storage.yandexcloud.net/sboard-whiteboard-prod/images/4126e229-eb62-4aef-9c27-ef1921bfa5d52b378579-88b1-4aaf-bd6d-24c274dadb46c60084ed-e87d-4f9f-b8c6-6f046f70dcf3f34a4ccf-9aef-415f-a08f-68966cca0770/clipboard-file.png" x="-2702.9" y="-1144.8" width="865.6" height="123.1" />
<image id="o11" data-type="image" href="https://storage.yandexcloud.net/sboard-whiteboard-prod/images/2aa3515a-016e-4ee6-84b9-ea5cb7a767f74dc06501-87d5-4423-8b7f-671ee40a6b648fea60ae-1f29-447f-b3a6-3278f4738fea30fe7eb3-e66c-4197-aa0b-59a93e0f2c42/clipboard-file.png" x="-2702.9" y="-1034.2" width="377.6" height="73.2" />
<textArea id="o12" x="-2711.9" y="-895.1" width="1948.5" font-size="23.4" font-family="open_sans" fill="#000000" text-align="center">чтобы умножить одночлен на многочлен, нужно умножить этот одночлен на каждый член многочлена и полученные произведения сложить</textArea>
<image id="o13" data-type="image" href="https://storage.yandexcloud.net/sboard-whiteboard-prod/images/79bb3636-7aea-4401-a991-0481ee4e44255ae2abd5-5729-4452-8117-0d6149dd0889a33e38a4-e4f5-42d1-88b1-005dfdabe727410c557c-a494-4300-aab4-0daafad74c7c/clipboard-file.png" x="-2711.9" y="-861.8" width="603.0" height="33.8" />
<image id="o14" data-type="image" href="https://storage.yandexcloud.net/sboard-whiteboard-prod/images/f23f5c87-4dcf-4cd3-ab03-396bef0a8a7746cbdbc4-a4ce-4240-af41-67ab50565bfa6c5840d9-117a-4555-99b6-f2ba57da71bbbda3aee7-b696-473a-b1e5-5c50f3c774e7/clipboard-file.png" x="-2702.9" y="-826.8" width="222.6" height="29.3" />
<textArea id="o30" x="-1650.8" y="-2020.8" width="137.4" font-size="28.3" font-family="open_sans" fill="#f85681" text-align="center"><b>Задания</b></textArea>
<rect id="o31" data-shape="rectangle" x="-222.8" y="-645.4" width="3299.4" height="2724.4" fill="#ffffff" stroke="none" />
<ellipse id="o32" cx="-1471.4" cy="-1708.7" rx="27.8" ry="27.8" fill="none" stroke="#9acd32" stroke-width="3" data-content="1" data-text-color="#9acd32" data-font-size="23.4" data-font-family="open_sans" data-text-align="center" data-text-align-vertical="middle" />
<textArea id="o33" x="-1506.3" y="-1917.3" width="556.7" font-size="23.4" font-family="open_sans" fill="#9acd32" text-align="left">Приведите подобные члены многочлена:</textArea>
<ellipse id="o34" cx="62.0" cy="-1697.6" rx="27.8" ry="27.8" fill="none" stroke="#f85681" stroke-width="3" data-content="2" data-text-color="#f85681" data-font-size="23.4" data-font-family="open_sans" data-text-align="center" data-text-align-vertical="middle" />
<textArea id="o35" x="357.6" y="-1725.4" width="634.0" font-size="23.4" font-family="open_sans" fill="#f85681" text-align="left">Представьте в стандартном виде многочлен:</textArea>
<ellipse id="o36" cx="-1471.4" cy="-1163.4" rx="27.8" ry="27.8" fill="none" stroke="#f85681" stroke-width="3" data-content="3" data-text-color="#f85681" data-font-size="23.4" data-font-family="open_sans" data-text-align="center" data-text-align-vertical="middle" />
<textArea id="o37" x="-970.4" y="-1191.2" width="1190.8" font-size="23.4" font-family="open_sans" fill="#f85681" text-align="left">Из данных многочленов выберите многочлен, тождественно равный выражению 5a+2b</textArea>
<ellipse id="o38" cx="62.0" cy="-1152.3" rx="27.8" ry="27.8" fill="none" stroke="#9acd32" stroke-width="3" data-content="4" data-text-color="#9acd32" data-font-size="23.4" data-font-family="open_sans" data-text-align="center" data-text-align-vertical="middle" />
<textArea id="o39" x="263.3" y="-1180.1" width="402.1" font-size="23.4" font-family="open_sans" fill="#9acd32" text-align="left">Какова степень многочлена:</textArea>
<ellipse id="o40" cx="-1468.8" cy="-455.1" rx="27.8" ry="27.8" fill="none" stroke="#9acd32" stroke-width="3" data-content="5" data-text-color="#9acd32" data-font-size="23.4" data-font-family="open_sans" data-text-align="center" data-text-align-vertical="middle" />
<textArea id="o41" x="-1191.8" y="-482.9" width="665.0" font-size="23.4" font-family="open_sans" fill="#9acd32" text-align="left">Преобразуйте в многочлен стандартного вида:</textArea>
<ellipse id="o42" cx="64.6" cy="-444.1" rx="27.8" ry="27.8" fill="none" stroke="#f85681" stroke-width="3" data-content="6" data-text-color="#f85681" data-font-size="23.4" data-font-family="open_sans" data-text-align="center" data-text-align-vertical="middle" />
<textArea id="o43" x="347.0" y="-482.9" width="587.7" font-size="23.4" font-family="open_sans" fill="#f85681" text-align="left">Преобразуйте произведение в многочлен:</textArea>
<ellipse id="o44" cx="-1443.5" cy="89.6" rx="27.8" ry="27.8" fill="none" stroke="#f85681" stroke-width="3" data-content="7" data-text-color="#f85681" data-font-size="23.4" data-font-family="open_sans" data-text-align="center" data-text-align-vertical="middle" />
<textArea id="o45" x="-942.5" y="65.4" width="1057.8" font-size="23.4" font-family="open_sans" fill="#f85681" text-align="left">Упростите выражение и найдите его значение:</textArea>
<ellipse id="o46" cx="89.9" cy="100.7" rx="27.8" ry="27.8" fill="none" stroke="#9acd32" stroke-width="3" data-content="8" data-text-color="#9acd32" data-font-size="23.4" data-font-family="open_sans" data-text-align="center" data-text-align-vertical="middle" />
<textArea id="o47" x="-2712.8" y="-703.6" width="2335.1" font-size="23.4" font-family="open_sans" fill="#000000" text-align="center">чтобы умножить многочлен на многочлен, нужно каждый член одного многочлена умножить на каждый член другого многочлена и полученные произведения сложить</textArea>
<image id="o48" data-type="image" href="https://storage.yandexcloud.net/sboard-whiteboard-prod/images/90082668-9cf3-478b-b3e6-9aa68f34a4d9b49dfc79-6a1b-460d-8ecb-0ea13cd20b4c4559c917-188c-4964-b98e-716781604744d86d3a50-ae92-4e8f-bb67-90691c474416/clipboard-file.png" x="-2702.9" y="-634.3" width="490.2" height="51.3" />
