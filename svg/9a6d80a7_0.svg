<rect id="o3" data-shape="round_rectangle" x="8.0" y="-2870.3" width="1641.8" height="1650.6" fill="#cce698" stroke="#1e90ff" stroke-width="3" data-content="📚 &lt;b&gt;Наши цели&lt;/b&gt;&lt;br/&gt;&lt;br/&gt;Получить 1 балл на ОГЭ: вспомнить типы связи в словосочетаниях&lt;br/&gt;&lt;br/&gt;Узнать, кто в предложении совершает действие, когда нет подлежащего&lt;br/&gt;&lt;br/&gt;Перечислить перечисляемое или знаки препинания при однородных членах предложения&lt;br/&gt;&lt;br/&gt;Обнаружить и обособить все вводные слова и конструкции" data-text-color="#0f1115" data-font-size="67.5" data-font-family="open_sans" data-text-align="center" data-text-align-vertical="middle" />
<rect id="o4" data-shape="round_rectangle" x="3438.1" y="-2870.3" width="1500.5" height="1367.5" fill="#b2e6d4" stroke="#008080" stroke-width="3" data-content="🔗 &lt;b&gt;ЗАДАНИЕ 1: Типы связи в словосочетаниях&lt;/b&gt;&lt;br/&gt;&lt;br/&gt;Определите тип связи:&lt;br/&gt;&lt;br/&gt;деревянный дом&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;читать книгу&lt;br/&gt;встретить друга&lt;br/&gt;первый снег&lt;br/&gt;говорить улыбаясь" data-text-color="#0f1115" data-font-size="67.5" data-font-family="open_sans" data-text-align="center" data-text-align-vertical="middle" />
<rect id="o6" data-shape="round_rectangle" x="1817.6" y="-868.7" width="1680.4" height="1476.7" fill="#a3e1cc" stroke="#008080" stroke-width="3" data-content="&lt;br/&gt;🎭 &lt;b&gt;ЗАДАНИЕ 2: Односоставные предложения&lt;/b&gt;&lt;br/&gt;&lt;br/&gt;Определите тип предложения:&lt;br/&gt;&lt;br/&gt;Люблю грозу в начале мая.&lt;br/&gt;В дверь постучали.&lt;br/&gt;Мне не спится.&lt;br/&gt;Вечер. Улица. Фонарь. Аптека." data-text-color="#0f1115" data-font-size="67.5" data-font-family="open_sans" data-text-align="center" data-text-align-vertical="middle" />
<rect id="o7" data-shape="round_rectangle" x="-2844.6" y="-698.4" width="1872.2" height="1769.4" fill="#a3e1cc" stroke="#008080" stroke-width="3" data-content="✂️ &lt;b&gt;ЗАДАНИЕ 3: Знаки препинания при обобщении&lt;/b&gt;&lt;br/&gt;&lt;br/&gt;Расставьте знаки препинания:&lt;br/&gt;&lt;br/&gt;	В человеке должно быть всё прекрасно и лицо и одежда и душа и мысли.&lt;br/&gt; Живя умей всё пережить Печаль и радость и тревогу.  &lt;br/&gt;Будущее принадлежит двум типам людей человеку мысли и человеку труда." data-text-color="#000000" data-font-size="67.5" data-font-family="open_sans" data-text-align="center" data-text-align-vertical="middle" />
<rect id="o8" data-shape="round_rectangle" x="-3925.6" y="2088.0" width="2333.3" height="1329.5" fill="#a3e1cc" stroke="#008080" stroke-width="3" data-content="🗣️&lt;b&gt; ЗАДАНИЕ 4:  Обособление вводных слов и обращений&lt;/b&gt;&lt;br/&gt;&lt;br/&gt;Вставьте знаки препинания:&lt;br/&gt;&lt;br/&gt;К счастью погода наладилась.&lt;br/&gt;Ты видимо ошибся адресом.&lt;br/&gt;Друзья мои прекрасен наш союз!&lt;br/&gt;Это решение кажется правильным." data-text-color="#0f1115" data-font-size="67.5" data-font-family="open_sans" data-text-align="center" data-text-align-vertical="middle" />
<rect id="o10" data-shape="cloud" x="882.0" y="2037.5" width="2093.9" height="1688.7" fill="#cce698" stroke="#1e90ff" stroke-width="3" data-content="🎯 &lt;b&gt;ИТОГ УРОКА&lt;/b&gt;&lt;br/&gt;&lt;br/&gt;💪 Ты отлично справился со сложными темами!" data-text-color="#0f1115" data-font-size="121.4" data-font-family="open_sans" data-text-align="center" data-text-align-vertical="middle" />
