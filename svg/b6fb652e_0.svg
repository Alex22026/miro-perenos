<rect id="o4" data-shape="rectangle" x="-3759.3" y="-1156.6" width="8.0" height="8.0" fill="none" stroke="#4e63e3" stroke-width="8" />
<rect id="o5" data-shape="wedge_round_rectangle_callout" x="-3933.2" y="-1173.8" width="672.8" height="129.4" fill="none" stroke="#000000" stroke-width="8" data-content="Предложение с &lt;b&gt;одной&lt;/b&gt; грамматической основой — &lt;b&gt;простое предложение&lt;/b&gt;." data-text-color="#333333" data-font-size="21.9" data-font-family="open_sans" data-text-align="center" data-text-align-vertical="middle" />
<textArea id="o6" x="-3708.5" y="-968.2" width="589.0" font-size="21.9" font-family="open_sans" fill="#333333" text-align="left">Рассмотрим следующее предложение:<br/><br/><i>Мама испекла вкусный пирог.</i><br/><br/>В этом предложении одна грамматическая основа, которая состоит из подлежащего и сказуемого:<br/><i>Мама испекла вкусный пирог.</i></textArea>
<rect id="o10" data-shape="wedge_round_rectangle_callout" x="-3889.3" y="-689.5" width="698.6" height="224.2" fill="none" stroke="#000000" stroke-width="8" data-content="Предложение &lt;b&gt;с двумя и более&lt;/b&gt; грамматическими основами — &lt;b&gt;сложное предложение&lt;/b&gt;. Сложное предложение состоит из нескольких простых." data-text-color="#333333" data-font-size="21.9" data-font-family="open_sans" data-text-align="center" data-text-align-vertical="middle" />
<image id="o11" data-type="image" href="https://storage.yandexcloud.net/sboard-whiteboard-prod/images/350f4472-6ff3-40e4-923c-62e1c22dad8872337126-bf91-4728-8575-accb99ce26eb6c878519-2d63-4a13-9cfc-8aa95a2bbfaabd4adbbf-fb60-42cd-be49-0a5155604f86/image.png" x="-4154.8" y="-548.2" width="125.0" height="137.2" />
<textArea id="o13" x="-3752.3" y="-311.3" width="514.4" font-size="21.9" font-family="open_sans" fill="#333333" text-align="left">А теперь посмотрим на другое предложение:<br/><br/><i>Мама испекла вкусный пирог, и мы пригласили гостей на чаепитие. </i><br/><br/>(Кто?) мама<br/>Мама (что сделала?) испекла<br/>(Кто?) мы<br/>Мы (что сделали?) пригласили<br/><br/>В этом предложении уже не одна, а две грамматические основы. Такое предложение называется <b>сложным</b>. Оно состоит их двух простых предложений, связанных по смыслу.</textArea>
<textArea id="o20" x="-2908.8" y="-177.5" width="957.8" font-size="21.9" font-family="open_sans" fill="#000000" text-align="left">Основные признаки сложносочинённого предложения<br/><br/><b>1. Части равноправны</b>. Каждая часть сложносочинённого предложения может существовать как самостоятельное предложение. Их можно разделить на два предложения. <br/><br/><b>Пример:</b><br/>   - Солнце светило ярко, и небо было чистым.<br/>   - Мама приготовила пирог, и мы пригласили гостей. <br/><br/>   - Солнце светило ярко. Небо было чистым.<br/>   - Мама приготовила пирог. Мы пригласили гостей на чаепитие. <br/><br/><b>2. Сочинительные союзы</b>. Связь между частями осуществляется с помощью сочинительных союзов (и, а, но).<br/><br/><b>Пример:</b><br/>   - Мы пошли в парк, а дети остались дома.<br/>   - Я вернулся со школы домой, но мамы еще не было.<br/><br/><b>3. Пунктуация между частями</b>. Между частями сложносочинённого предложения всегда ставится запятая перед союзом.<br/><br/><b>Пример:</b><br/>    - Шёл дождь, и ветер гнал листья.</textArea>
<textArea id="o23" x="-1852.7" y="-222.2" width="965.1" font-size="21.9" font-family="open_sans" fill="#333333" text-align="left"><b>РАЗЛИЧИЯ МЕЖДУ СОЮЗАМИ А, НО, И</b><br/><br/>Союз <b>«И»</b> служит для выражения соединенности, совокупности, совместности, содействия<br/><br/>Мой друг любит театр, и я тоже люблю театр. Это мама и папа (Они вместе, под союзом можно нарисовать знак плюс для наглядности).<br/><br/><br/>Союз<b> «А» </b>служит для выражения противопоставления, контрастности<br/><br/>Это мальчик, а это девочка.(Он -она) Это дом, а это собака (что? – кто?) Он говорит, а она слушает (говорит- слушает)<br/><br/><br/>Союз <b>«НО»</b> служит для выражения противопоставления, акцентирует противоречие с предположением, которое можно сделать на основании предшествующего высказывания.<br/><br/>Я плохо говорю по-русски, но понимаю хорошо. Я слушаю, но не понимаю. </textArea>
<image id="o25" data-type="image" href="https://storage.yandexcloud.net/sboard-whiteboard-prod/images/728bdc27-2470-4e97-a58f-5c051b55d1dc1d863bb3-c5c2-41b5-b0ff-6d58c85f93e41b3a0b42-86b4-42f2-935d-6c08abfb3af20e29fd29-80b1-417c-84e6-c080fe80a940/image.png" x="-1086.2" y="-1062.8" width="219.4" height="236.2" />
<textArea id="o26" x="-592.8" y="-919.8" width="837.7" font-size="21.9" font-family="open_sans" fill="#333333" text-align="left"><i><b>Вопрос 1.</b></i><i> </i>Что такое простое предложение?<br/><i><b>Вопрос 2.</b></i><i> </i>Какое предложение называется сложным?<br/><i><b>Вопрос 3. </b></i>Как могут быть соединены простые предложения в составе сложного?<br/><i><b>Вопрос 4. </b></i>Какие союзы можно встретить в сложных предложениях? Какой знак препинания ставится перед союзами?</textArea>
<textArea id="o28" x="-581.5" y="-0.2" width="1152.6" font-size="21.9" font-family="open_sans" fill="#0f1115" text-align="left">1. Солнце уже село, но на небе ещё оставались розовые облака.<br/><br/>2. Котенок сладко спал на диване.<br/><br/>3. На улице идет сильный дождь.<br/><br/>4. Он очень хотел пойти гулять, но ему нужно было закончить уроки.<br/><br/>5. Я люблю читать книги, а мой брат предпочитает смотреть фильмы.<br/><br/>6. Вода в реке была ледяной.<br/><br/>7. Трава на лугу была изумрудно-зеленой.<br/><br/>8. Мы могли поехать на море, а могли остаться в городе.<br/><br/>9. Звезды ярко мерцали в ночном небе.<br/><br/>10. Птицы улетели на юг, и в лесу стало очень тихо.<br/><br/>11. Кофе остыл.<br/><br/>12.Она включила свет, и в комнате стало светло.<br/><br/>13. Листья шуршали под ногами.<br/><br/>14. Я позвонил другу, и пригласил его в гости.<br/><br/>15. Утро было свежим и прохладным.<br/><br/>16. Письмо лежало на столе.<br/><br/>17. Он говорил долго и эмоционально, но никто ему не верил.<br/><br/>18. Дорога была трудной, но виды открывались потрясающие.<br/><br/>19. Дети играли в мяч.<br/><br/>20. Я ждал тебя целый час, а ты даже не позвонил.</textArea>
