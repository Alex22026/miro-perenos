<svg xmlns="http://www.w3.org/2000/svg">
<textArea id="o1" x="-4212.7" y="-2824.8" width="283.4" font-size="71.6" font-family="open_sans" fill="#000000" text-align="left">Теория</textArea>
<image id="o2" data-type="image" href="https://raw.githubusercontent.com/Alex22026/miro-perenos/main/img/bc0d3df149babae7c8ee.jpg" x="-5050.8" y="-2617.3" width="591.0" height="427.5" />
<image id="o3" data-type="image" href="https://raw.githubusercontent.com/Alex22026/miro-perenos/main/img/1aa8d4be0528f33a1069.jpg" x="-5265.2" y="-1646.9" width="1019.7" height="237.3" />
<image id="o4" data-type="image" href="https://raw.githubusercontent.com/Alex22026/miro-perenos/main/img/35bddd010278cfd87a1e.jpg" x="-5197.6" y="-1160.1" width="844.3" height="650.9" />
<image id="o5" data-type="image" href="https://raw.githubusercontent.com/Alex22026/miro-perenos/main/img/4e45a0352de40f28709d.jpg" x="-4078.5" y="1711.5" width="680.8" height="393.9" />
<image id="o6" data-type="image" href="https://raw.githubusercontent.com/Alex22026/miro-perenos/main/img/5596e32dadcf2ff3bcd5.jpg" x="-4078.5" y="2403.6" width="680.8" height="421.3" />
<image id="o7" data-type="image" href="https://raw.githubusercontent.com/Alex22026/miro-perenos/main/img/730c878654bc3b4cd0e4.jpg" x="-4078.5" y="26.1" width="801.2" height="480.3" />
<image id="o8" data-type="image" href="https://raw.githubusercontent.com/Alex22026/miro-perenos/main/img/7ed005513d64cd222162.jpg" x="-4078.5" y="811.9" width="767.2" height="475.6" />
<textArea id="o9" x="-4117.5" y="-2667.7" width="1014.8" font-size="34.3" font-family="open_sans" fill="#000000" text-align="left">Что такое линейная функция и её график</textArea>
<textArea id="o10" x="-3948.6" y="-2368.8" width="1379.5" font-size="34.3" font-family="open_sans" fill="#000000" text-align="left"><b>Линейная функция (прямая)</b> имеет вид <i>y </i>= <i>kx </i>+ <i>b</i>, где <i>k </i>— угловой коэффициент, который характеризует угол, который образует прямая <i>y </i>= <i>kx </i>+ <i>b </i>положительным направлением оси <i>Ох</i>. <br/><u>Если </u><u><i>k </i></u><u>&gt; 0</u>, то этот угол острый; <br/><u>если </u><u><i>k </i></u><u>&lt; 0</u>, то — тупой; <br/><u>если </u><u><i>k </i></u><u>= 0</u>, то прямая параллельна оси <i>Ох </i>или совпадает с ней.<br/>Угловой коэффициент касательной равен тангенсу угла наклона касательной с положительным направлением оси абсцисс<br/> <u><i>k </i></u><u>= tg </u><u><i>α</i></u><u>,</u> где <i>α </i>— угол наклона касательной.</textArea>
<image id="o11" data-type="image" href="https://raw.githubusercontent.com/Alex22026/miro-perenos/main/img/cf88403139359a81fd0d.jpg" x="-5050.8" y="-2043.4" width="591.0" height="274.0" />
<textArea id="o12" x="-4156.9" y="-1741.0" width="929.6" font-size="34.3" font-family="open_sans" fill="#000000" text-align="left">Что такое производная функции</textArea>
<textArea id="o13" x="-3703.4" y="-1228.2" width="1909.1" font-size="34.3" font-family="open_sans" fill="#000000" text-align="left"><b>Производная функции</b><br/><i>Производной функции </i>в точке называется предел отношения приращения функции к приращению аргумента, если приращение аргумента стремится к нулю и если этот предел существует<br/><br/><b>Геометрический смысл производной функции</b><br/>Знание углового коэффициента касательной к графику функции позволяет ответить на некоторые вопросы при исследовании функции.<br/><br/>Значение производной функции <i>y </i>= <i>f</i>(<i>x</i>) в точке <i>x</i>0 равно угловому коэффициенту касательной, проведенной к графику функции в точке с абсциссой <i>x</i>0:<br/>        <u><i><b>f</b></i></u><u><b>&#x27;(</b></u><u><i><b>x</b></i></u><u><b>) = </b></u><u><i><b>k</b></i></u><u><b>.</b></u><br/>Если производная функции <i>y </i>= <i>f</i>(<i>x</i>) в точке <i>x</i>0 равна нулю, то касательная, проведенная к графику этой функции в точке с абсциссой <i>x</i>0, параллельна оси абсцисс или совпадает с ней. Так как угловой коэффициент касательной равен тангенсу угла наклона касательной с положительным направлением оси абсцисс <i>k </i>= tg <i>α</i>, то<br/><i> </i>     <u><b> </b></u><u><i><b>f</b></i></u><u><b>&#x27;(</b></u><u><i><b>x</b></i></u><u><b>0 ) = tg </b></u><u><i><b>α</b></i></u><u><b>.</b></u></textArea>
<textArea id="o14" x="-3948.6" y="-362.5" width="1379.5" font-size="34.3" font-family="open_sans" fill="#000000" text-align="left"><b>Исследование функции</b><br/><i>Промежутки монотонности функции (промежутки возрастания и убывания функции)</i><br/><br/>Функция <i>y </i>= <i>f</i>(<i>x</i>) называется возрастающей на интервале (<i>a</i>;<i>b</i>), если для любых <i>x</i>1 и <i>x</i>2 из этого интервала таких, что <i>x</i>1 &lt; <i>x</i>2, справедливо неравенство <i>f</i>(<i>x</i>1) &lt; <i>f</i>(<i>x</i>2).</textArea>
<textArea id="o15" x="-3948.6" y="479.9" width="3574.9" font-size="34.3" font-family="open_sans" fill="#000000" text-align="left">Функция <i>y </i>= <i>f</i>(<i>x</i>) называется убывающей на интервале (<i>a</i>;<i>b</i>), если для любых <i>x</i>1 и <i>x</i>2 из этого интервала таких, что <i>x</i>1 &lt; <i>x</i>2, справедливо неравенство <i>f</i>(<i>x</i>1) &gt; <i>f</i>(<i>x</i>2).</textArea>
<textArea id="o16" x="-3948.6" y="1425.2" width="1379.5" font-size="34.3" font-family="open_sans" fill="#000000" text-align="left"><i><b>Точки экстремума (точки максимума и минимума функции)</b></i><br/><br/>Точка <i>xmax </i>области определения функции называется точкой максимума, если для всех <i>x </i>из некоторой окрестности этой точки справедливо неравенство <i>f</i>(<i>x</i>) &lt; <i>f</i>(<i>xmax</i>). Значение <i>ymax </i>= <i>f</i>(<i>xmax</i>) называется максимумом этой функции.</textArea>
<textArea id="o17" x="-3948.6" y="2123.5" width="4909.9" font-size="34.3" font-family="open_sans" fill="#000000" text-align="left">Точка <i>xmin </i>области определения функции называется точкой минимума, если для всех <i>x </i>из некоторой окрестности этой точки справедливо неравенство <i>f</i>(<i>x</i>) &gt; <i>f</i>(<i>xmin</i>). Значение <i>ymax </i>= <i>f</i>(<i>xmin</i>) называется минимумом этой функции.</textArea>
<textArea id="o18" x="-1818.2" y="-2824.8" width="377.9" font-size="71.6" font-family="open_sans" fill="#000000" text-align="left">Практика</textArea>
