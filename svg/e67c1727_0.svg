<svg xmlns="http://www.w3.org/2000/svg">
<rect id="o1" data-shape="round_rectangle" x="1582.9" y="-1755.7" width="1163.5" height="504.9" fill="#ffd2e8" stroke="#000000" stroke-width="8" />
<rect id="o2" data-shape="round_rectangle" x="-2194.2" y="-1518.6" width="3151.0" height="979.0" fill="#ffd2e8" stroke="#000000" stroke-width="8" />
<textArea id="o4" x="-3134.3" y="-1657.0" width="963.8" font-size="34.1" font-family="open_sans" fill="#1a1a1a" text-align="left">Действительное причастие - это причастие, обозначающее признак субъекта, который самостоятельно производит действие. <br/><b>Пример: </b>танцующий мальчик.<br/><br/>Страдательное причастие - это причастие, обозначающее признак объекта, над которым совершается действие. <b>Пример:</b> читаемая книга. </textArea>
<textArea id="o5" x="-2194.2" y="-1852.8" width="1085.8" font-size="31.6" font-family="open_sans" fill="#1a1a1a" text-align="left">Суффиксы действительных и страдательных причастий : </textArea>
<image id="o6" data-type="image" href="https://storage.yandexcloud.net/sboard-whiteboard-prod/images/39dcfed7-1cf3-4fe5-8914-36dd2c1cecd87b41cc79-cc67-484e-ba14-4d3f02a8fb90ef77f9f8-b539-4de7-bcf1-4e6d0f64cdb313c5f9a1-b910-4eb4-b7c4-8559277b0031/image263.jpg" x="-2231.7" y="-1657.0" width="732.1" height="358.9" />
<textArea id="o7" x="-1235.0" y="-1518.6" width="879.2" font-size="22.7" font-family="open_sans" fill="#1a1a1a" text-align="left"><b>Образование действительных причастий прошедшего времени</b><br/>Действительные причастия прошедшего времени можно образовать от переходных и непереходных глаголов как совершенного, так и несовершенного вида.<br/>Действительные причастия прошедшего времени образуются с помощью суффиксов <b>-вш- и -ш-.</b><br/><b>Например:</b><br/>отдать — отдавший,<br/>прибыть — прибывший,<br/>привести — приведший.<br/>Если основа глагола, от которого образовано действительное причастие прошедшего времени, оканчивается на согласный, тогда мы используем суффикс -ш-.<br/> <b>Например:</b><br/>привести — приведший.<br/>Если основа глагола оканчивается на гласный, тогда мы используем суффикс -вш-. Например:<br/>прибыть — прибывший.<br/><b>Запоминаем!</b><br/>При написании действительных причастий прошедшего времени перед суффиксом нужно сохранить ту же гласную, что и в неопределённой форме глагола перед «ть». Например: увидеть — увидевший, заклеить — заклеивший.</textArea>
<textArea id="o8" x="-3210.7" y="-501.6" width="1074.2" font-size="22.9" font-family="open_sans" fill="#000000" text-align="left"><b>Перестройте и запишите предложения так, чтобы вместо глагола стояло действительное причастие или страдательное (а если возможно — то и то, и другое).</b><br/><b>Н-Р: Автобус выезжает по маршруту. – Автобус,  выезжающий  по маршруту, скоро заберет пассажиров.</b><br/> Мама пригласила соседей в гости. - _____________________________________________________<br/>____________________________________________________________________________________<br/>Врач лечит больных. - _________________________________________________________________<br/>Мальчик бежит по дороге. - ____________________________________________________________<br/>Пришла весна, и снег растаял. - _________________________________________________________<br/>_____________________________________________________________________________________<br/>Библиотекарь рекомендует книгу. - ______________________________________________________<br/>_____________________________________________________________________________________<br/> Весь сад засыпали сухие листья. - _______________________________________________________<br/>_____________________________________________________________________________________<br/><i><b>ПОДСКАЗКА </b></i><b>Причастия всегда сохраняют вид того глагола, от которого они образованы.</b></textArea>
<textArea id="o9" x="1493.8" y="-1181.2" width="1064.1" font-size="28.4" font-family="open_sans" fill="#000000" text-align="left"><b>От данных глаголов образуйте и запишите действительные причастия настоящего времени, выделите суффиксы.</b><br/>Строить, беседовать, смотреть, отправляться, любить, клеить, ненавидеть, держать, падать, брить, гнать, плыть, терпеть, скакать, видеть, обидеть, стелить, чистить.</textArea>
<textArea id="o10" x="-3225.8" y="131.3" width="1051.2" font-size="22.9" font-family="open_sans" fill="#000000" text-align="left"><i><b>.Вставьте окончания у причастий. </b></i><b>Распределите словосочетания в две колонки: действительные причастия настоящего времени и действительные причастия прошедшего времени. Выделите формообразующие суффиксы причастий, объясните выбор гласных в суффиксах.</b><br/><br/>Смёрзш….ся снегу, покалывающ… травы, приближающ…ся шума, полыхающ... огнем, сросш…ся<br/><br/> корней, выцветш… волос, выпавш… граде, тающ… снежинки, сияющ… лица,<br/><br/> выгоревш… лесу, удаляющ…ся автобус,  переправивш…ся  рыболовы  , распахнувш…ся окно,<br/><br/>движущ…ся силы, блистающ… вершин, распустивш…ся волокнам, повлёкш… товарища,<br/><br/>волнующ…ся море, увядш… цветка, прибывш… поездами, розовеющ… небосклону.</textArea>
<textArea id="o11" x="1425.6" y="-749.1" width="916.7" font-size="26.9" font-family="open_sans" fill="#000000" text-align="left"><b> От данных глаголов образуйте и запишите действительные причастия прошедшего времени.</b><br/>Скатываться,<br/>Беречь  -<br/>Делать -<br/>Продрогнуть -<br/>Переправить -<br/>Преодолеть -<br/>Стелить -<br/> Вырасти -<br/>Раскинуться -<br/>Жить -</textArea>
