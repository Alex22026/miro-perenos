<textArea id="o20" x="-10348.6" y="-1697.1" width="4951.3" font-size="139.1" font-family="open_sans" fill="#0f1115" text-align="left"><b>📘 Правописание Н и НН в суффиксах имен прилагательных</b></textArea>
<textArea id="o21" x="7741.5" y="-2387.2" width="5608.2" font-size="80.3" font-family="open_sans" fill="#0f1115" text-align="center"><b>🟢 Н и НН В СУФФИКСАХ ПРИЛАГАТЕЛЬНЫХ</b></textArea>
<rect id="o22" data-shape="rectangle" x="-3233.9" y="-526.6" width="2406.9" height="2754.0" fill="#f6f6f6" stroke="#f6f6f6" stroke-width="3" data-content="&lt;b&gt;1. ВСТАВЬ ПРОПУЩЕННЫЕ БУКВЫ (БАЗОВЫЙ УРОВЕНЬ)&lt;/b&gt;&lt;br/&gt;&lt;br/&gt;&lt;b&gt;1.1. Вставьте Н или НН.&lt;/b&gt;&lt;br/&gt;Глиня…ый кувшин&lt;br/&gt;Стекля…ая ваза&lt;br/&gt;Деревя…ый стул&lt;br/&gt;Оловя…ый солдатик&lt;br/&gt;Кожа…ая куртка&lt;br/&gt;Серебря…ая ложка&lt;br/&gt;Румя…ые щёки&lt;br/&gt;Ю…ый натуралист&lt;br/&gt;Ветре…ый день&lt;br/&gt;Тума…ое утро&lt;br/&gt;&lt;b&gt;Ответы:&lt;/b&gt;&lt;br/&gt;глиня&lt;b&gt;н&lt;/b&gt;ый (-ян-)&lt;br/&gt;стекля&lt;b&gt;нн&lt;/b&gt;ый (искл.)&lt;br/&gt;деревя&lt;b&gt;нн&lt;/b&gt;ый (искл.)&lt;br/&gt;оловя&lt;b&gt;нн&lt;/b&gt;ый (искл.)&lt;br/&gt;кожа&lt;b&gt;н&lt;/b&gt;ый (-ан-)&lt;br/&gt;серебря&lt;b&gt;н&lt;/b&gt;ый (-ян-)&lt;br/&gt;румя&lt;b&gt;н&lt;/b&gt;ые (искл.)&lt;br/&gt;ю&lt;b&gt;н&lt;/b&gt;ый (искл.)&lt;br/&gt;ветре&lt;b&gt;н&lt;/b&gt;ый (искл.)&lt;br/&gt;тума&lt;b&gt;нн&lt;/b&gt;ое (-нн-)&lt;br/&gt;&lt;br/&gt;&lt;b&gt;1.2. Вставьте Н или НН.&lt;/b&gt;&lt;br/&gt;Карти…ая галерея&lt;br/&gt;Стари…ые часы&lt;br/&gt;Каме…ый дом&lt;br/&gt;Песча…ый берег&lt;br/&gt;Льня…ое полотенце&lt;br/&gt;Журавли…ый клин&lt;br/&gt;Лебеди…ая верность&lt;br/&gt;Соловьи…ая трель&lt;br/&gt;Орли…ый взгляд&lt;br/&gt;Мыши…ая возня&lt;br/&gt;&lt;b&gt;Ответы:&lt;/b&gt;&lt;br/&gt;карти&lt;b&gt;нн&lt;/b&gt;ая (-нн-)&lt;br/&gt;стари&lt;b&gt;нн&lt;/b&gt;ые (-нн-)&lt;br/&gt;каме&lt;b&gt;нн&lt;/b&gt;ый (-н-)&lt;br/&gt;песча&lt;b&gt;н&lt;/b&gt;ый (-ан-)&lt;br/&gt;льня&lt;b&gt;н&lt;/b&gt;ое (-ян-)&lt;br/&gt;журавли&lt;b&gt;н&lt;/b&gt;ый (-ин-)&lt;br/&gt;лебеди&lt;b&gt;н&lt;/b&gt;ая (-ин-)&lt;br/&gt;соловьи&lt;b&gt;н&lt;/b&gt;ая (-ин-)&lt;br/&gt;орли&lt;b&gt;н&lt;/b&gt;ый (-ин-)&lt;br/&gt;мыши&lt;b&gt;н&lt;/b&gt;ая (-ин-)" data-text-color="#0f1115" data-font-size="35.0" data-font-family="open_sans" data-text-align="left" data-text-align-vertical="top" />
<textArea id="o23" x="5627.9" y="-2190.5" width="350.5" font-size="162.3" font-family="open_sans" fill="#000000" text-align="left">💥</textArea>
<rect id="o24" data-shape="rectangle" x="-848.4" y="-523.0" width="2128.9" height="2746.6" fill="#f6f6f6" stroke="#f6f6f6" stroke-width="3" data-content="&lt;b&gt;2. РАСПРЕДЕЛИ ПО КОЛОНКАМ&lt;/b&gt;&lt;br/&gt;&lt;br/&gt;&lt;b&gt;2.1. Распределите слова в три колонки:&lt;/b&gt;&lt;br/&gt;&lt;br/&gt;&lt;b&gt;1) Н&lt;/b&gt; &lt;b&gt;2) НН&lt;/b&gt; &lt;b&gt;3) исключения (запомнить)&lt;/b&gt;&lt;br/&gt;&lt;i&gt;Слова:&lt;/i&gt; кожаный, стеклянный, ветреный, юный, серебряный, оловянный, румяный, деревянный, глиняный, свиной, багряный.&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;b&gt;2.2. Распределите слова в две колонки:&lt;/b&gt;&lt;br/&gt;&lt;br/&gt;&lt;b&gt;1) образованы с помощью суффикса -Н-&lt;/b&gt; &lt;b&gt;2) образованы с помощью суффикса -ЕНН-&lt;/b&gt;&lt;br/&gt;&lt;i&gt;Слова:&lt;/i&gt; каменный, торжественный, лимонный, искусственный, туманный, общественный, старинный, соломенный, традиционный, утренний." data-text-color="#0f1115" data-font-size="35.0" data-font-family="open_sans" data-text-align="left" data-text-align-vertical="middle" />
<rect id="o25" data-shape="rectangle" x="1433.1" y="-576.3" width="2248.5" height="2595.8" fill="#f6f6f6" stroke="#f6f6f6" stroke-width="3" data-content="&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;3. ОБРАЗУЙ ПРИЛАГАТЕЛЬНЫЕ&lt;br/&gt;&lt;br/&gt;3.1. Образуйте прилагательные с помощью указанных суффиксов.&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;3.2. Образуйте прилагательные от данных слов.&lt;br/&gt;&lt;br/&gt;революция → революцио&lt;b&gt;нн&lt;/b&gt;ый&lt;br/&gt;искусство → искусстве&lt;b&gt;нн&lt;/b&gt;ый&lt;br/&gt;хозяйство → хозяйстве&lt;b&gt;нн&lt;/b&gt;ый&lt;br/&gt;экскурсия → экскурсио&lt;b&gt;нн&lt;/b&gt;ый&lt;br/&gt;торжество → торжестве&lt;b&gt;нн&lt;/b&gt;ый&lt;br/&gt;традиция → традицио&lt;b&gt;нн&lt;/b&gt;ый&lt;br/&gt;станция → станцион&lt;b&gt;нн&lt;/b&gt;ый (суффикс -ОНН-)&lt;br/&gt;солома → соломе&lt;b&gt;нн&lt;/b&gt;ый&lt;br/&gt;клюква → клюкве&lt;b&gt;нн&lt;/b&gt;ый&lt;br/&gt;песок → песча&lt;b&gt;н&lt;/b&gt;ый (чередование к/ч)" data-text-color="#0f1115" data-font-size="35.0" data-font-family="open_sans" data-text-align="left" data-text-align-vertical="middle" />
<rect id="o26" data-shape="rectangle" x="6099.8" y="-1216.1" width="2117.1" height="1319.0" fill="#f6f6f6" stroke="#f6f6f6" stroke-width="3" data-content="&lt;br/&gt;&lt;b&gt;5. РАБОТА С ТЕКСТОМ&lt;/b&gt;&lt;br/&gt;&lt;br/&gt;&lt;b&gt;5.1. Вставьте пропущенные буквы.&lt;/b&gt;&lt;br/&gt;&lt;b&gt;Осен…ий лес&lt;/b&gt;&lt;br/&gt;Наступила поз…яя осень. Утре…ий туман стелился над рекой. Ветре…ый день сменился безветре…ым вечером. Деревя…ая лодка тихо покачивалась на воде. На песча…ом берегу лежали соломе…ые тюки. Вдали виднелся стари…ый дом с каме…ой пристройкой. Его оловя…ая крыша блестела в лучах заходящего солнца. Глиня…ые горшки на крыльце были покрыты инеем. Торжестве…ая тишина опустилась на землю. Казалось, сама природа замерла в ожидании чего-то необыкнове…ого.&lt;br/&gt;&lt;br/&gt;&lt;b&gt;Ответы:&lt;/b&gt;&lt;br/&gt;&lt;i&gt;Осе&lt;/i&gt;&lt;i&gt;&lt;b&gt;нн&lt;/b&gt;&lt;/i&gt;&lt;i&gt;ий лес&lt;/i&gt;&lt;br/&gt;Наступила по&lt;b&gt;зд&lt;/b&gt;няя осень. Утре&lt;b&gt;нн&lt;/b&gt;ий туман стелился над рекой. Ветре&lt;b&gt;н&lt;/b&gt;ый день сменился безветре&lt;b&gt;нн&lt;/b&gt;ым вечером. Деревя&lt;b&gt;нн&lt;/b&gt;ая лодка тихо покачивалась на воде. На песча&lt;b&gt;н&lt;/b&gt;ом берегу лежали соломе&lt;b&gt;нн&lt;/b&gt;ые тюки. Вдали виднелся стари&lt;b&gt;нн&lt;/b&gt;ый дом с каме&lt;b&gt;нн&lt;/b&gt;ой пристройкой. Его оловя&lt;b&gt;нн&lt;/b&gt;ая крыша блестела в лучах заходящего солнца. Глиня&lt;b&gt;н&lt;/b&gt;ые горшки на крыльце были покрыты инеем. Торжестве&lt;b&gt;нн&lt;/b&gt;ая тишина опустилась на землю. Казалось, сама природа замерла в ожидании чего-то необыкнове&lt;b&gt;нн&lt;/b&gt;ого." data-text-color="#0f1115" data-font-size="32.7" data-font-family="open_sans" data-text-align="left" data-text-align-vertical="middle" />
<textArea id="o27" x="7829.4" y="520.5" width="337.8" font-size="156.4" font-family="open_sans" fill="#0f1115" text-align="center"><b>👁</b></textArea>
<textArea id="o28" x="10181.5" y="-2209.3" width="337.8" font-size="156.4" font-family="open_sans" fill="#0f1115" text-align="center"><b>🙏🏻</b></textArea>
<rect id="o29" data-shape="rectangle" x="3817.6" y="-1180.1" width="2220.0" height="1338.3" fill="#f6f6f6" stroke="#f6f6f6" stroke-width="3" data-content="&lt;b&gt;4. НАЙДИ И ИСПРАВЬ ОШИБКУ&lt;/b&gt;&lt;br/&gt;&lt;br/&gt;&lt;b&gt;4.1. В каждом предложении есть одна ошибка. Найдите и исправьте её.&lt;/b&gt;&lt;br/&gt;Стекляный стакан стоял на столе.&lt;br/&gt;Это был деревяный дом.&lt;br/&gt;На улице ветренный день.&lt;br/&gt;Она купила кожанную куртку.&lt;br/&gt;У неё румянные щёки.&lt;br/&gt;&lt;b&gt;Ответы:&lt;/b&gt;&lt;br/&gt;стекля&lt;b&gt;нн&lt;/b&gt;ый&lt;br/&gt;деревя&lt;b&gt;нн&lt;/b&gt;ый&lt;br/&gt;ветре&lt;b&gt;н&lt;/b&gt;ый&lt;br/&gt;кожа&lt;b&gt;н&lt;/b&gt;ую&lt;br/&gt;румя&lt;b&gt;н&lt;/b&gt;ые&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;b&gt;4.2. Найдите ошибки в написании Н/НН. Если ошибок нет, оставьте предложение без изменений.&lt;/b&gt;&lt;br/&gt;Картина была написана масляными красками. &lt;i&gt;(ошибок нет)&lt;/i&gt;&lt;br/&gt;Мы гуляли по песчанному пляжу.&lt;br/&gt;Учительница была взволнована новостью. &lt;i&gt;(ошибок нет)&lt;/i&gt;&lt;br/&gt;Он был очень юнный.&lt;br/&gt;На стене висела картинная галерея. &lt;i&gt;(ошибок нет)&lt;/i&gt;&lt;br/&gt;&lt;b&gt;Ответы:&lt;/b&gt;&lt;br/&gt;2. песча&lt;b&gt;н&lt;/b&gt;ому&lt;br/&gt;4. ю&lt;b&gt;н&lt;/b&gt;ый" data-text-color="#0f1115" data-font-size="30.3" data-font-family="open_sans" data-text-align="left" data-text-align-vertical="middle" />
<textArea id="o30" x="14676.0" y="-2209.3" width="465.6" font-size="215.6" font-family="open_sans" fill="#0f1115" text-align="center"><b>🫶🏻</b></textArea>
<textArea id="o31" x="12489.0" y="-971.1" width="391.9" font-size="181.4" font-family="open_sans" fill="#0f1115" text-align="center"><b>✌🏻</b></textArea>
<rect id="o32" data-shape="rectangle" x="8341.1" y="-541.6" width="2117.1" height="2486.5" fill="#f6f6f6" stroke="#f6f6f6" stroke-width="3" data-content="&lt;br/&gt;6. КРАТКИЕ ПРИЛАГАТЕЛЬНЫЕ&lt;br/&gt;&lt;br/&gt;6.1. Образуйте краткие формы (ж.р., ед.ч.) от данных прилагательных.&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;6.2. Вставьте Н или НН в краткие формы.&lt;br/&gt;Местность пусты…а.&lt;br/&gt;Девушка взволнова…а.&lt;br/&gt;Небо безлу…о.&lt;br/&gt;Дорога дли…а.&lt;br/&gt;Его ответы увере…ы.&lt;br/&gt;Её щёки румя…ы.&lt;br/&gt;Погода ветре…а.&lt;br/&gt;Решение было обдума…о.&lt;br/&gt;Природа величестве…а.&lt;br/&gt;Эти люди опас…ы.&lt;br/&gt;&lt;b&gt;Ответы:&lt;/b&gt;&lt;br/&gt;пусты&lt;b&gt;нн&lt;/b&gt;а&lt;br/&gt;взволнова&lt;b&gt;нн&lt;/b&gt;а&lt;br/&gt;безлу&lt;b&gt;нн&lt;/b&gt;о&lt;br/&gt;дли&lt;b&gt;нн&lt;/b&gt;а&lt;br/&gt;увере&lt;b&gt;нн&lt;/b&gt;ы&lt;br/&gt;румя&lt;b&gt;н&lt;/b&gt;ы&lt;br/&gt;ветре&lt;b&gt;н&lt;/b&gt;а&lt;br/&gt;обдума&lt;b&gt;нн&lt;/b&gt;о&lt;br/&gt;величестве&lt;b&gt;нн&lt;/b&gt;а&lt;br/&gt;опас&lt;b&gt;н&lt;/b&gt;ы" data-text-color="#0f1115" data-font-size="32.7" data-font-family="open_sans" data-text-align="left" data-text-align-vertical="middle" />
