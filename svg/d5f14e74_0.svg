<svg xmlns="http://www.w3.org/2000/svg">
<textArea id="o1" x="-2707.7" y="-2085.9" width="599.5" font-size="33.0" font-family="open_sans" fill="#086c0b" text-align="left"><b>ПРЕОБРАЗОВАНИЯ ВЫРАЖЕНИЙ</b></textArea>
<rect id="o2" data-shape="rectangle" x="-2710.5" y="-1387.7" width="551.5" height="1286.1" fill="#ffffff" stroke="none" />
<textArea id="o3" x="-2710.5" y="-1646.6" width="507.9" font-size="27.3" font-family="open_sans" fill="#9acd32" text-align="center">1)<br/>Переместительное свойство: для любых чисел a и b верны равенства <br/>a + b = b + a, <br/>ab = ba<br/><br/>2)<br/>Сочетательное свойство: для любых чисел a, b и c верны равенства<br/> (a + b) + c = a +( b + c ),<br/> ( ab ) c = a ( bc )<br/><br/>3)<br/>Распределительное свойство: для любых чисел a , b и c верно равенство <br/>a ( b + c )= ab +ac</textArea>
<textArea id="o4" x="-2710.5" y="-915.4" width="527.7" font-size="27.3" font-family="open_sans" fill="#9acd32" text-align="center">в любой сумме можно как угодно переставлять слагаемые и<br/>произвольным образом объединять их в группы<br/><br/>в любом произведении можно как угодно переставлять множители и произвольным образом объединять их в группы</textArea>
<rect id="o5" data-shape="rectangle" x="-481.9" y="-1384.4" width="3192.4" height="1279.4" fill="#ffffff" stroke="none" />
<textArea id="o6" x="-1755.1" y="-2050.3" width="450.8" font-size="27.3" font-family="open_sans" fill="#9acd32" text-align="center"><b>Задания на преобразование</b></textArea>
<ellipse id="o7" cx="-1988.9" cy="-1903.9" rx="32.6" ry="32.1" fill="#ffffff" stroke="#9acd32" stroke-width="3" data-content="1" data-text-color="#9acd32" data-font-size="27.3" data-font-family="open_sans" data-text-align="center" data-text-align-vertical="middle" />
<textArea id="o8" x="-1642.0" y="-1979.4" width="757.3" font-size="27.3" font-family="open_sans" fill="#9acd32" text-align="center">Вычислите наиболее рациональным способом: </textArea>
<textArea id="o9" x="-1782.0" y="-1922.7" width="559.0" font-size="27.3" font-family="open_sans" fill="#19572a" text-align="left">а) 2,34 + 5,13 + 7,66 + 4,87 = </textArea>
<ellipse id="o10" cx="-273.1" cy="-1904.6" rx="32.6" ry="32.1" fill="#ffffff" stroke="#9acd32" stroke-width="3" data-content="2" data-text-color="#9acd32" data-font-size="27.3" data-font-family="open_sans" data-text-align="center" data-text-align-vertical="middle" />
<textArea id="o11" x="-1804.8" y="-1191.3" width="468.8" font-size="27.3" font-family="open_sans" fill="#19572a" text-align="left">1) 4,2 ⋅ 5,7 + 4,2 ⋅ 4,3 =</textArea>
<ellipse id="o12" cx="-1988.9" cy="-1157.9" rx="32.6" ry="32.1" fill="#ffffff" stroke="#9acd32" stroke-width="3" data-content="3" data-text-color="#9acd32" data-font-size="27.3" data-font-family="open_sans" data-text-align="center" data-text-align-vertical="middle" />
<textArea id="o13" x="106.2" y="-1190.0" width="829.5" font-size="27.3" font-family="open_sans" fill="#19572a" text-align="left">а) Докажите, что сумма 18⋅23+23⋅7 делится на 5</textArea>
<ellipse id="o14" cx="-273.1" cy="-1157.9" rx="32.6" ry="32.1" fill="#ffffff" stroke="#9acd32" stroke-width="3" data-content="4" data-text-color="#9acd32" data-font-size="27.3" data-font-family="open_sans" data-text-align="center" data-text-align-vertical="middle" />
<textArea id="o15" x="-2650.5" y="-643.2" width="221.8" font-size="33.0" font-family="open_sans" fill="#19572a" text-align="left"><b>ТОЖДЕСТВА</b></textArea>
<rect id="o16" data-shape="rectangle" x="-2650.5" y="294.5" width="962.9" height="1789.7" fill="#ffffff" stroke="none" />
<textArea id="o17" x="-2650.5" y="-466.9" width="1032.8" font-size="27.3" font-family="open_sans" fill="#9acd32" text-align="center">Равенство, верное при любых значениях переменных, называется тождеством<br/>Например:<br/>2a + 2b = 2 (a+b)</textArea>
<textArea id="o18" x="-2650.5" y="-96.3" width="1071.0" font-size="27.3" font-family="open_sans" fill="#19572a" text-align="center">Два выражения, значения которых рав-<br/>ны при любых значениях переменных, называются тождественно равными<br/><br/>Свойства преобразования - пример тождества<br/><br/>Ещё примеры: <br/>a + 0 = a,<br/>a + (–a) = 0,<br/>a – b = a + (– b),<br/>a*1=a,<br/>a+(–a) = 0<br/>a*(–b)=–ab,<br/> (–a)(–b)=ab</textArea>
<textArea id="o19" x="-2650.5" y="468.4" width="1040.0" font-size="27.3" font-family="open_sans" fill="#9acd32" text-align="center">Подобными слагаемыми называют слагаемые, имеющие одинаковую буквенную часть,<br/>чтобы привести подобные слагаемые, надо сложить их коэффициенты и результат умножить на общую буквенную<br/>часть<br/>Например: <br/>дано выражение<br/>4х + х + y + 2z + 8x<br/>подобными будут: 4x, x, 8x<br/>приведем подобные: <br/>(4+1+8)*x + y + 2z</textArea>
<textArea id="o20" x="-2657.7" y="915.2" width="1055.5" font-size="27.3" font-family="open_sans" fill="#9acd32" text-align="center">Знаки при раскрытии скобок:<br/>если перед скобками стоит знак «плюс», то скобки можно<br/>опустить. Например:<br/>(2x + 3y) +1 = 2x + 3y +1<br/><br/>если перед скобками стоит знак «минус», то скобки можно<br/>опустить, изменив знак каждого слагаемого<br/>в скобках на противоположный. Например:<br/>- (2x + 3y) + 1 = -2x - 3y +1</textArea>
<rect id="o21" data-shape="rectangle" x="-481.9" y="292.7" width="3192.4" height="1793.3" fill="#ffffff" stroke="none" />
<textArea id="o22" x="-1790.1" y="-460.5" width="377.0" font-size="27.3" font-family="open_sans" fill="#19572a" text-align="left">а) (3m)*(5n) и 15mn</textArea>
<textArea id="o23" x="-1802.4" y="-623.5" width="360.6" font-size="27.3" font-family="open_sans" fill="#9acd32" text-align="center"><b>Задания на тождества</b></textArea>
<ellipse id="o24" cx="-1988.9" cy="-434.8" rx="32.6" ry="32.1" fill="#ffffff" stroke="#9acd32" stroke-width="3" data-content="1" data-text-color="#9acd32" data-font-size="27.3" data-font-family="open_sans" data-text-align="center" data-text-align-vertical="middle" />
<textArea id="o25" x="-1628.1" y="-538.1" width="727.0" font-size="27.3" font-family="open_sans" fill="#9acd32" text-align="left">Являются ли тождественно равными выражения? <br/>Если да, отметьте эти выражения</textArea>
<rect id="o26" data-shape="rectangle" x="-1579.4" y="-457.3" width="45.0" height="45.0" fill="#ffffff" stroke="#008080" stroke-width="3" />
<rect id="o27" data-shape="rectangle" x="-1579.4" y="-391.9" width="45.0" height="45.0" fill="#ffffff" stroke="#008080" stroke-width="3" />
<rect id="o28" data-shape="rectangle" x="-1579.4" y="-319.5" width="45.0" height="45.0" fill="#ffffff" stroke="#008080" stroke-width="3" />
<textArea id="o29" x="74.3" y="-460.2" width="811.4" font-size="27.3" font-family="open_sans" fill="#19572a" text-align="left">а) Равенство 7(x+2)=7x+14 является тождеством</textArea>
<ellipse id="o30" cx="-273.1" cy="-434.8" rx="32.6" ry="32.1" fill="#ffffff" stroke="#9acd32" stroke-width="3" data-content="2" data-text-color="#9acd32" data-font-size="27.3" data-font-family="open_sans" data-text-align="center" data-text-align-vertical="middle" />
<textArea id="o31" x="-84.8" y="-538.1" width="378.7" font-size="27.3" font-family="open_sans" fill="#9acd32" text-align="left">Верны ди утверждения:</textArea>
<textArea id="o32" x="-1748.8" y="164.5" width="466.4" font-size="27.3" font-family="open_sans" fill="#19572a" text-align="left">а) 5(a − b) </textArea>
<ellipse id="o33" cx="-1988.9" cy="193.0" rx="32.6" ry="32.1" fill="#ffffff" stroke="#9acd32" stroke-width="3" data-content="3" data-text-color="#9acd32" data-font-size="27.3" data-font-family="open_sans" data-text-align="center" data-text-align-vertical="middle" />
<textArea id="o34" x="-1552.7" y="96.3" width="889.8" font-size="27.3" font-family="open_sans" fill="#9acd32" text-align="left">Преобразуйте выражение в тождественно равное, используя<br/>распределительное свойство умножения</textArea>
<ellipse id="o35" cx="-273.1" cy="199.6" rx="32.6" ry="32.1" fill="#ffffff" stroke="#9acd32" stroke-width="3" data-content="4" data-text-color="#9acd32" data-font-size="27.3" data-font-family="open_sans" data-text-align="center" data-text-align-vertical="middle" />
<textArea id="o36" x="-20.9" y="115.8" width="522.9" font-size="27.3" font-family="open_sans" fill="#9acd32" text-align="left">Приведите подобные слагаемые:</textArea>
<textArea id="o37" x="37.4" y="172.3" width="627.0" font-size="27.3" font-family="open_sans" fill="#19572a" text-align="left">а) 9m − 5n + 4m − 3n = </textArea>
<textArea id="o38" x="-1736.2" y="850.2" width="493.6" font-size="27.3" font-family="open_sans" fill="#19572a" text-align="left">а) 8 − (b − 4) =</textArea>
<ellipse id="o39" cx="-1988.9" cy="882.4" rx="32.6" ry="32.1" fill="#ffffff" stroke="#9acd32" stroke-width="3" data-content="5" data-text-color="#9acd32" data-font-size="27.3" data-font-family="open_sans" data-text-align="center" data-text-align-vertical="middle" />
<textArea id="o40" x="-1843.1" y="798.6" width="306.5" font-size="27.3" font-family="open_sans" fill="#9acd32" text-align="left">Раскройте скобки:</textArea>
<ellipse id="o41" cx="-273.1" cy="882.4" rx="32.6" ry="32.1" fill="#ffffff" stroke="#9acd32" stroke-width="3" data-content="6" data-text-color="#9acd32" data-font-size="27.3" data-font-family="open_sans" data-text-align="center" data-text-align-vertical="middle" />
<textArea id="o42" x="37.4" y="798.6" width="703.2" font-size="27.3" font-family="open_sans" fill="#9acd32" text-align="left">Упростите выражение и найдите значение:</textArea>
<textArea id="o43" x="131.9" y="850.2" width="835.0" font-size="27.3" font-family="open_sans" fill="#19572a" text-align="left">а) (4a − 2) − (3 − 6a)  при a = 0,5</textArea>
<textArea id="o44" x="-1814.9" y="-1821.8" width="645.3" font-size="27.3" font-family="open_sans" fill="#19572a" text-align="center">б) 11,8 + 4,2 - 3,5 - 1,5 = </textArea>
<textArea id="o45" x="-1788.9" y="-1726.8" width="522.9" font-size="27.3" font-family="open_sans" fill="#19572a" text-align="center">в) 6,25 + 1,09 + 3,75 + 8,91=</textArea>
<textArea id="o46" x="-1801.3" y="-1648.5" width="522.9" font-size="27.3" font-family="open_sans" fill="#19572a" text-align="center"> <br/>г) -2,18 + 7,4 - 4,82 + 2,6 =</textArea>
