<textArea id="o52" x="-1824.7" y="-1020.3" width="593.0" font-size="27.3" font-family="open_sans" fill="#19572a" text-align="center">3) 2,8 ⋅ 7,3 + 2,8 ⋅ 2,7 =</textArea>
